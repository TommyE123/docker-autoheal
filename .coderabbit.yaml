# CodeRabbit Configuration
# Schema: https://coderabbit.ai/integrations/schema.v2.json

language: "en-GB"

tone_instructions: >
  Follow the review format and standards defined in REVIEW.md exactly.
  Use GREEN / AMBER / RED statuses. List blocking issues first.
  End with a clear merge recommendation.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "REVIEW.md"

reviews:
  profile: "chill"
  high_level_summary: true
  review_status: true
  collapse_walkthrough: false
  request_changes_workflow: false

  path_filters:
    - "!**/*.lock"
    - "!dist/**"
    - "!node_modules/**"

  path_instructions:
    - path: "**/*"
      instructions: |
        Use REVIEW.md as the authoritative source for review structure,
        status labels (GREEN / AMBER / RED), and merge recommendations.
        This overrides CodeRabbit's default review format.

  auto_review:
    enabled: true
    drafts: false

chat:
  auto_reply: true
