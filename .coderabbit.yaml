language: en-GB

reviews:
  profile: chill

  auto_review:
    enabled: true
    auto_pause_after_reviewed_commits: 0

  path_instructions:
    - path: "{**/*,**/.*,**/.*/**}"
      instructions: |
        Apply REVIEW.md as the canonical review standard for this repository.

        Perform a surgical review of this PR. Review only issues introduced or
        materially worsened by the PR's changes.

        Follow the review scope, evidence threshold, priorities, production-safety
        checks, and reporting requirements defined in REVIEW.md.

        Do not perform a general repository audit or request unrelated cleanup,
        formatting, refactoring, or cosmetic changes.

        Do not manufacture findings. Prefer a small number of high-confidence
        findings over speculative or low-value comments.

        If no actionable issue exists, report that clearly as a GREEN review.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "REVIEW.md"
