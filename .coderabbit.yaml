reviews:
  profile: "chill"

  auto_review:
    enabled: true

  path_instructions:
    - path: "{**/*,**/.*,**/.*/**}"
      instructions: |
        Apply the repository review standard in REVIEW.md.

        REVIEW.md is the canonical review guidance for this repository.
        Use it as the authoritative source for review scope, evidence threshold,
        priorities, production-safety checks, and the definition of a surgical
        review.

        Review only issues introduced or materially worsened by this PR.
        Do not perform a general repository audit or request unrelated cleanup.

        Follow the review methodology and reporting requirements defined in
        REVIEW.md. If the changed code is sound, confirm that no changes are
        required.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "REVIEW.md"