# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: en-GB

tone_instructions: >-
  Follow REVIEW.md's format exactly: the overall review status, the
  per-finding RED/AMBER/GREEN tags, and the single closing verdict.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: false
  collapse_walkthrough: false

  path_filters:
    - "!**/*.lock"
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!frontend/dist/**"
    - "!frontend/package-lock.json"
    - "!**/coverage.xml"
    - "!**/*.min.js"
    - "!**/*.min.css"

  path_instructions:
    - path: "{**/*,**/.*,**/.*/**}"
      instructions: |
        Use REVIEW.md as the authoritative review standard for this
        repository, in full — its review status, per-finding tags, and
        verdict format all apply. This overrides CodeRabbit's default
        review format.

        Perform a surgical review: only issues introduced or materially
        worsened by this PR's changes. Do not perform a general repository
        audit or request unrelated cleanup, formatting, or refactoring.

        Do not manufacture findings. If the PR is correct, say so plainly.
    - path: "app/**/*.py"
      instructions: >
        This is the FastAPI backend for a Docker container health-monitoring
        service. Pay close attention to Docker SDK error handling, async/await
        correctness, and any code that restarts or stops containers -
        mistakes here can affect production containers. Flag missing
        input validation on API endpoints and unhandled exceptions around
        Docker API calls.
    - path: "app/tests/**"
      instructions: >
        Test files should assert real behavior, not just that a call was
        made. Prefer clear arrange/act/assert structure and flag tests that
        don't actually verify the outcome they claim to.
    - path: "frontend/src/**"
      instructions: >
        This is a React (Vite) frontend using react-bootstrap. Flag missing
        key props in lists, unnecessary re-renders, and unhandled promise
        rejections from axios calls.
    - path: "Dockerfile*"
      instructions: >
        Review for image size, layer caching, and security best practices
        (avoid running as root, pin base image versions, minimize installed
        packages).
    - path: ".github/workflows/**"
      instructions: >
        Check that third-party actions are pinned to a full commit SHA (as
        already done in this repo) and that secrets aren't exposed in logs.

  auto_review:
    enabled: false

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - REVIEW.md
