    dotenvLint:
      enabled: false
    eslint:
      enabled: false
    flake8:
      enabled: false
    gitleaks:
      enabled: false
    golangci-lint:
      enabled: false
    hadolint:
      enabled: false
    htmlhint:
      enabled: false
    luacheck:
