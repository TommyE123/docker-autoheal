[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "C4",
    "SIM",
    "PERF",
    "S",
    "D",
    "ANN",
    "PL",
    "ARG",
    "PTH",
    "DTZ",
    "TRY",
    "PT",
    "RET",
    "RSE",
    "TCH",
    "ASYNC",
    "TID",
    "SLF",
    "ERA",
    "G",
    "LOG",
    "N",
    "PIE",
    "RUF",
]

ignore = [
    "E111",
    "E114",
    "E117",
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
