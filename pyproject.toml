By single rule code, B904 (33) is actually the largest — but it's the one you don't want to defer: it's flagging raise HTTPException(...) inside an except Exception as e: block with no from e, which silently discards the original traceback. That's a real debugging problem in production, not a style nit.

The actual worst-offending, least-important one: PLC0415
Second-largest at 25, and it's the low-value one:

What it flags: import statements inside functions instead of at module top-level — e.g. from fastapi.responses import FileResponse inside a route handler.
Why it's often intentional, not a mistake: lazy/local imports are a normal, deliberate pattern for avoiding circular imports and for keeping startup-time imports light (e.g. demo.py's dependencies). Flagging every one of these means fighting a pattern the codebase already uses on purpose.
Contrast with B904, S113 (kept): those catch real bugs — swallowed exceptions and network calls with no timeout, respectively.
I'm deferring PLC0415 the same way as before (dated comment, revisit later).

One thing I'm not deferring: I001 (27, import sorting). It's just as mechanical/low-value as PLC0415, but unlike it, there's no reason to defer something ruff check --fix --select I001 fixes in one shot with zero risk — deferring it only leaves imports messy for no benefit. Worth running that command instead, whenever's convenient.

