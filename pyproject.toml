# Mutation-testing configuration only. Nothing else reads this file:
# pytest.ini and .coveragerc keep owning test and coverage settings, and
# .linter-rules/.ruff.toml owns Ruff. See docs/developer/mutation-testing.md.
[tool.mutmut]
# Required: mutmut's directory-name auto-detection fails for "docker-autoheal".
source_paths = ["app"]

# Without this mutmut also mutates the tests themselves (~13.6k extra mutants,
# including the integration suite). Scope choice: .coveragerc also omits app/tests/*.
do_not_mutate = ["app/tests/*"]

# These modules read repository files (.github/workflows/*.yml, .vscode/tasks.json,
# docker-compose.dev.yml)
# via parents[3], which do not exist inside mutants/, so stats collection aborts if
# they are collected. They import nothing from app/, so they cannot kill an
# application mutant.
pytest_add_cli_args_test_selection = [
    "--ignore=app/tests/unit/test_release_please_workflow.py",
    "--ignore=app/tests/unit/test_dev_stack_files.py",
]
