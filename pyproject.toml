[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "SIM",
    "PERF",
    "S",
    "PL",
    "ARG",
    "PTH",
    "DTZ",
    "PT",
    "RET",
    "RSE",
    "TCH",
    "ASYNC",
    "TID",
    "SLF",
    "ERA",
    "LOG",
    "N",
    "PIE",
    "RUF",

    # --- Deferred 2026-09-20 ------------------------------------------
    # Pulled out of select rather than ignored code-by-code: these are
    # the five largest categories in the 2026-09-20 megalinter run and
    # we're committing to fixing them properly, not nibbling at them.
    # Re-add to select (and delete this comment) when that work starts.
    #   "G",    # logging format (f-strings in log calls, etc.)
    #   "UP",   # pyupgrade / syntax modernization
    #   "TRY",  # exception-handling style (tryceratops)
    #   "ANN",  # type annotations
    #   "D",    # pydocstyle
    # Revisit by 2026-12-31.
]

ignore = [
    "E111",
    "E114",
    "E117",
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# --- Deferred 2026-09-20: test-only noise ---------------------------------
# ANN and D are already off everywhere (see the select comment above), so
# only the test-specific rules need listing here:
#   SLF001                  - unit tests routinely reach into
#            `engine._private_attr` to assert on internal state; that's the
#            point of a white-box test, not a smell.
#   PLR2004                 - literal values in assertions (`== 3`, `== 20`)
#            are expected test data, not "magic numbers" to extract into
#            constants.
#   ARG001, ARG002, ARG005  - unused fixture/mock arguments
#            (`docker_client`, `update_config`, lambda `k`) are a standard
#            pytest pattern for autouse/injected fixtures.
# Revisit alongside the select-level deferrals above.
"**/tests/**" = ["S101", "SLF001", "PLR2004", "ARG001", "ARG002", "ARG005"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
