# Mutation-testing configuration only. Nothing else reads this file:
# pytest.ini and .coveragerc keep owning test and coverage settings, and
# .ruff.toml owns Ruff. See docs/developer/mutation-testing.md.
[tool.mutmut]
# Required: mutmut's directory-name auto-detection fails for "docker-autoheal".
source_paths = ["app"]

# Without this mutmut also mutates the tests themselves (~13.6k extra mutants,
# including the integration suite) and app/scripts/demo.py. Scope choice: app/scripts
# is also omitted by .coveragerc.
do_not_mutate = ["app/tests/*", "app/scripts/*"]

# This module reads .github/workflows/*.yml via parents[3], which does not
# exist inside mutants/, so stats collection aborts if it is collected. It
# imports nothing from app/, so it cannot kill an application mutant.
pytest_add_cli_args_test_selection = ["--ignore=app/tests/unit/test_release_please_workflow.py"]
