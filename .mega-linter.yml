# Configuration file for MegaLinter
# See all available variables at https://megalinter.io/latest/configuration/ and in linters documentation

DISABLE:
  - ANSIBLE
  - BICEP
  - C
  - CSHARP
  - CPP
  - COPYPASTE
  - DART
  - GO
  - GRAPHQL
  - GROOVY
  - JAVA
  - KOTLIN
  - KUBERNETES
  - LUA
  - PHP
  - PERL
  - R
  - RAKU
  - RUBY
  - RUST
  - SALESFORCE
  - SCALA
  - SPELL
  - SWIFT
  - TERRAFORM
  - VBDOTNET

DISABLE_LINTERS:
  - PYTHON_BLACK
  - PYTHON_FLAKE8
  - PYTHON_ISORT
  - PYTHON_NBQA_MYPY
  - PYTHON_PYLINT

DISABLE_ERRORS_LINTERS:
  - ACTION_ZIZMOR
  - CSS_STYLELINT
  - JAVASCRIPT_STANDARD
  - POWERSHELL_POWERSHELL
  - PYTHON_BANDIT
  - PYTHON_MYPY
  - PYTHON_PYRIGHT
  - PYTHON_RUFF
  - PYTHON_RUFF_FORMAT
  - REPOSITORY_CHECKOV
  - REPOSITORY_DEVSKIM
  - REPOSITORY_GRYPE
  - REPOSITORY_OSV_SCANNER
  - REPOSITORY_TRIVY

DOCKERFILE_HADOLINT_FILE_NAMES_REGEX: ["Dockerfile(\\..+)?"]
FLAVOR_SUGGESTIONS: false
GITHUB_STATUS_REPORTER: true
JSON_JSONLINT_ARGUMENTS: "-B"
MARKDOWN_MARKDOWNLINT_CONFIG_FILE: ".markdownlint.jsonc"
MARKDOWN_MARKDOWNLINT_RULES_PATH: "."
PYTHON_DEFAULT_STYLE: ruff
REPOSITORY_OSV_SCANNER_ARGUMENTS: "--no-resolve"
SHOW_ELAPSED_TIME: true
VALIDATE_ALL_CODEBASE: true
YAML_YAMLLINT_ARGUMENTS: "--strict"

ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN

PYTHON_MYPY_PRE_COMMANDS:
  - command: pip install --no-cache-dir -r requirements-dev.txt

PYTHON_PYRIGHT_PRE_COMMANDS:
  - command: pip install --no-cache-dir -r requirements-dev.txt
