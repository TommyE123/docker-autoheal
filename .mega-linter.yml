# Configuration file for MegaLinter
# See all available variables at https://megalinter.github.io/configuration/ and in linters documentation
SHOW_ELAPSED_TIME: true
VALIDATE_ALL_CODEBASE: true
GITHUB_COMMENT_REPORTER: false
GITHUB_STATUS_REPORTER: false

# Linters below have existing findings in this repository. They remain
# enabled and their findings stay visible, but do not fail the build until
# a follow-up issue fixes the underlying findings.
DISABLE_ERRORS_LINTERS:
  - PYTHON_PYLINT
  - PYTHON_FLAKE8
  - PYTHON_BLACK
  - PYTHON_ISORT
  - PYTHON_BANDIT
  - PYTHON_MYPY
  - PYTHON_RUFF
  - PYTHON_PYRIGHT
  - JAVASCRIPT_ESLINT
  - JAVASCRIPT_PRETTIER
  - JSON_PRETTIER
  - YAML_YAMLLINT
  - YAML_PRETTIER
  - DOCKERFILE_HADOLINT
  - MARKDOWN_MARKDOWNLINT
  - SPELL_CSPELL
  - REPOSITORY_TRIVY
  - COPYPASTE_JSCPD
  - POWERSHELL_POWERSHELL
