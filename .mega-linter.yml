# Configuration file for MegaLinter
# See all available variables at https://megalinter.io/latest/configuration/ and in linters documentation

DISABLE:
  - COPYPASTE
  - SPELL

FLAVOR_SUGGESTIONS: false
FORMATTERS_DISABLE_ERRORS: false
GITHUB_STATUS_REPORTER: true
DOCKERFILE_HADOLINT_FILE_NAMES_REGEX: ["Dockerfile(\\..+)?"]
SHOW_ELAPSED_TIME: true
VALIDATE_ALL_CODEBASE: true
YAML_YAMLLINT_ARGUMENTS: "--strict"

# Linters below have existing findings in this repository. They remain
# enabled and their findings stay visible, but do not fail the build until
# a follow-up issue fixes the underlying findings.
#
# MARKDOWN_MARKDOWNLINT was in this list but is now enabled for real (see
# .markdownlint.jsonc, which turns off only the two rules - MD013 line-length
# and MD060 table-pipe-style - that conflict with this repo's established
# prose/table formatting, rather than suppressing the linter's findings
# wholesale). MARKDOWN_MARKDOWN_TABLE_FORMATTER is a separate table-alignment
# formatter and is left disabled here: enabling it would mean reformatting
# every table in the repo to its specific alignment style, which hasn't been
# done or verified.
DISABLE_ERRORS_LINTERS:
  - ACTION_ZIZMOR
  - PYTHON_PYLINT
  - PYTHON_FLAKE8
  - PYTHON_BLACK
  - PYTHON_ISORT
  - PYTHON_BANDIT
  - PYTHON_MYPY
  - PYTHON_RUFF
  - PYTHON_PYRIGHT
  - JAVASCRIPT_STANDARD
  - CSS_STYLELINT
  - MARKDOWN_MARKDOWN_TABLE_FORMATTER
  - REPOSITORY_TRIVY
  - REPOSITORY_GRYPE
  - REPOSITORY_OSV_SCANNER
  - REPOSITORY_CHECKOV
  - REPOSITORY_DEVSKIM
  - POWERSHELL_POWERSHELL

ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN
