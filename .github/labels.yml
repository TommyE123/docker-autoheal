# Source of truth for the GitHub *label definitions* (name/color/description)
# in the issue-classification taxonomy used by Gemini-powered issue triage
# (see .github/workflows/issue-triage.md, a GitHub Agentic Workflow). The
# same list also constrains the `add-labels` safe-output allow-list in that
# workflow's frontmatter - both must be kept in sync by hand when the
# taxonomy changes.
#
# Ownership model:
#   kind/*   - owned by Gemini triage (what kind of issue this is)
#   area/*   - owned by Gemini triage (which part of the codebase it touches)
#   status/* - owned by the triage workflow (where the issue is in the triage
#              lifecycle)
#   everything else (priority, assignment, milestones, release:* PR labels,
#   etc.) - owned by humans / other existing processes, and is out of scope
#   for this file.
#
# Synced to GitHub with EndBug/label-sync (see
# .github/workflows/labels-sync.yml), which only creates/updates the labels
# listed below by exact name. Deliberately no `aliases` here: a label is a
# single repository-wide object, so renaming one via label-sync (or deleting
# one via the repo-wide "delete a label" endpoint) would affect every issue
# *and every pull request* that happens to carry it - not just the issues
# this taxonomy is about. Migrating legacy issue labels onto this taxonomy
# is instead done issue-by-issue in labels-sync.yml's migrate-issue-labels
# job, which only ever adds/removes labels on individual issues and never
# touches the shared label object.

# --- kind/* --------------------------------------------------------------

- name: kind/bug
  color: d73a4a
  description: Unexpected behaviour, failures or incorrect results.

- name: kind/enhancement
  color: a2eeef
  description: New functionality, improvements or behaviour changes.

- name: kind/documentation
  color: 0075ca
  description: Documentation, README, examples or guides.

- name: kind/chore
  color: bfd4f2
  description: Maintenance, refactoring, dependency updates, test coverage.

# --- area/* ----------------------------------------------------------------

- name: area/docker
  color: 1d76db
  description: Docker API, container/image lifecycle handling.

- name: area/restart
  color: d4c5f9
  description: Restart detection, decision-making and triggering.

- name: area/health-check
  color: 0e8a16
  description: Health monitoring, Uptime Kuma integration, monitor state.

- name: area/config
  color: fbca04
  description: Configuration, environment variables, config parsing.

- name: area/logging
  color: c2e0c6
  description: Logging, diagnostics, verbosity, log output.

- name: area/github-actions
  color: 5319e7
  description: CI/CD, GitHub Actions, releases, repository automation.

- name: area/tests
  color: 006b75
  description: Unit tests, integration tests, test coverage.

# --- status/* --------------------------------------------------------------

- name: status/needs-triage
  color: e99695
  description: Awaiting kind/area classification.

- name: status/needs-information
  color: f9d0c4
  description: Awaiting more information from the reporter.
