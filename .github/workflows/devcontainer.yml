name: Dev Container

on:
  pull_request:
    branches:
      - main
    # Only the environment definition - tests.yml already resolves the
    # dependency files, on the same Python and Node versions.
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devcontainer:
    name: Build and test Dev Container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Validates that the environment builds and its tooling runs, not that
      # the application works - tests.yml owns that.
      - name: Build and test Dev Container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          runCmd: |
            set -e

            # devcontainers/ci's headless exec ignores devcontainer.json's
            # remoteEnv.PATH, so re-add ~/.local/bin here.
            export PATH="${HOME}/.local/bin:${PATH}"

            echo "== Versions =="
            python --version
            node --version
            npm --version
            docker --version
            docker compose version
            gh --version
            actionlint --version
            hadolint --version
            osv-scanner --version
            trivy --version
            trufflehog --version
            betterleaks --version
            dockerfmt --version

            echo "== Development tools =="
            pytest --version
            ruff --version
            pyright --version
            semgrep --version
            shellcheck --version
            shfmt --version
            zizmor --version
            yamllint --version
            djlint --version
            editorconfig-checker --version
            htmlhint --version
            jsonlint --help
            markdownlint-cli2 --version
            markdown-table-formatter --version
            secretlint --version
            stylelint --version
            v8r --version
            ls-lint --version

            echo "== Frontend development tools =="
            # Run from frontend/ so npm exec resolves local node_modules.
            (cd frontend && npm exec -- eslint --version)
            (cd frontend && npm exec -- prettier --version)
            (cd frontend && npm exec -- vite --version)

            echo "== Backend import =="
            python -c "import app.main"

            # Smoke check only - tests.yml runs the suite for real.
            echo "== Pytest collection =="
            python -m pytest --collect-only -q

            echo "== Docker access =="
            docker run --rm hello-world

            # The fragile part: Compose talking to the host daemon via DooD.
            echo "== Docker Compose stack =="
            docker compose -f docker-compose.test.yml up -d --build autoheal
            healthy=false
            for _ in $(seq 1 60); do
              if [ "$(docker inspect -f '{{.State.Health.Status}}' docker-autoheal 2>/dev/null)" = "healthy" ]; then
                healthy=true
                break
              fi
              sleep 2
            done
            if [ "$healthy" != "true" ]; then
              echo "::error::docker compose stack did not become healthy"
              docker compose -f docker-compose.test.yml logs
              docker compose -f docker-compose.test.yml down --remove-orphans
              exit 1
            fi
            echo "docker compose stack is healthy"
            docker compose -f docker-compose.test.yml down --remove-orphans
