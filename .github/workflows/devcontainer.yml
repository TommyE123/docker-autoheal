name: Dev Container

on:
  pull_request:
    branches:
      - main
    # Run for the environment definition and dependency inputs installed by
    # post-create.sh. tests.yml separately validates application behavior.
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "mise.toml"
      - "mise.lock"
      - ".mise/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - "Dockerfile"
      - ".dockerignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devcontainer:
    name: Build and test Dev Container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Authenticated pulls avoid Docker Hub's anonymous rate limit (429). Best effort: if the
      # login itself fails (a Docker Hub outage), carry on with anonymous pulls. Repo secrets are
      # not available to fork or Dependabot runs, which skip this step.
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A known container on the runner's own (host) Docker daemon. The Dev Container's
      # isolated daemon must not be able to see it; see the isolation check below.
      - name: Start host-daemon isolation sentinel
        run: docker run -d --name docker-autoheal-host-isolation-fixture alpine:3.22 sleep 3600

      # Validates that the environment builds and its tooling runs, not that
      # the application works - tests.yml owns that.
      - name: Build and test Dev Container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          runCmd: |
            set -e
            trap 'status=$?; printf "::error::Command failed (exit %s): %s\n" "$status" "$BASH_COMMAND"; exit "$status"' ERR

            # devcontainers/ci's headless exec ignores devcontainer.json's
            # remoteEnv.PATH, so re-add the mise shims and pip's user scripts here.
            export PATH="${HOME}/.local/share/mise/shims:${HOME}/.local/bin:${PATH}"

            echo "== Versions =="
            actionlint --version
            betterleaks --version
            docker --version
            docker compose version
            gh --version
            mise --version
            hadolint --version
            node --version
            npm --version
            osv-scanner --version
            python --version
            trivy --version
            trufflehog --version

            echo "== Development tools =="
            djlint --version
            editorconfig-checker --version
            htmlhint --version
            jsonlint --version
            ls-lint --version
            markdown-table-formatter --version
            markdownlint-cli2 --version
            pyright --version
            pytest --version
            ruff --version
            secretlint --version
            semgrep --version
            shellcheck --version
            shfmt --version
            stylelint --version
            v8r --version
            yamllint --version
            zizmor --version

            echo "== Frontend development tools =="
            (cd frontend && npm exec -- eslint --version)
            (cd frontend && npm exec -- prettier --version)
            (cd frontend && npm exec -- vite --version)

            echo "== Backend import =="
            python -c "import app.main"

            # Smoke check only - tests.yml runs the suite for real.
            echo "== Pytest collection =="
            python -m pytest --collect-only -q

            # The fragile part: Compose talking to the Dev Container's own (Docker-in-Docker)
            # daemon, not the host's.
            echo "== Isolated Docker daemon =="
            pgrep -x dockerd
            # The host daemon holds docker-autoheal-host-isolation-fixture; if this client
            # can see it (or anything else), it is not talking to the isolated daemon.
            if docker ps -a --format '{{.Names}}' | grep -qx docker-autoheal-host-isolation-fixture; then
              echo "::error::Host daemon sentinel container is visible from inside the Dev Container"
              docker ps -a
              exit 1
            fi
            # CI starts from a fresh inner-daemon volume, so it must begin empty (local
            # rebuilds keep their containers; see the docs).
            if [ -n "$(docker ps -aq)" ]; then
              echo "::error::Containers from outside the Dev Container are visible to its Docker daemon"
              docker ps -a
              exit 1
            fi

            echo "== Docker Compose dev stack =="
            compose='docker compose -p docker-autoheal-dev -f docker-compose.yml -f docker-compose.dev.yml'
            # Chained with && (not a { ...; } group): set -e is ignored inside the left side
            # of ||, so a group could swallow a failing step. Logs are printed on any failure.
            $compose up -d --build --wait autoheal &&
              curl -fsS http://localhost:3132/health &&
              echo &&
              echo "dev stack is healthy" &&
              bash .devcontainer/verify-isolation.sh || {
              echo "::error::dev stack did not become healthy or the isolation check failed"
              $compose logs
              $compose down --remove-orphans
              exit 1
            }
            $compose down --remove-orphans

      - name: Remove host-daemon isolation sentinel
        if: always()
        run: docker rm -f docker-autoheal-host-isolation-fixture
