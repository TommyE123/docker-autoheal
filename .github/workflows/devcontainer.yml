name: Dev Container

on:
  pull_request:
    branches:
      - main
    # Run for the environment definition and dependency inputs installed by
    # post-create.sh. tests.yml separately validates application behavior.
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "mise.toml"
      - "mise.lock"
      - ".mise/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "docker-compose.yml"
      - "Dockerfile"
      - ".dockerignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devcontainer:
    name: Build and test Dev Container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Validates that the environment builds and its tooling runs, not that
      # the application works - tests.yml owns that.
      - name: Build and test Dev Container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          runCmd: |
            set -e
            trap 'status=$?; printf "::error::Command failed (exit %s): %s\n" "$status" "$BASH_COMMAND"; exit "$status"' ERR

            # devcontainers/ci's headless exec ignores devcontainer.json's
            # remoteEnv.PATH, so re-add the mise shims and pip's user scripts here.
            export PATH="${HOME}/.local/share/mise/shims:${HOME}/.local/bin:${PATH}"

            echo "== Versions =="
            actionlint --version
            betterleaks --version
            docker --version
            docker compose version
            gh --version
            mise --version
            hadolint --version
            node --version
            npm --version
            osv-scanner --version
            python --version
            trivy --version
            trufflehog --version

            echo "== Development tools =="
            djlint --version
            editorconfig-checker --version
            htmlhint --version
            jsonlint --version
            ls-lint --version
            markdown-table-formatter --version
            markdownlint-cli2 --version
            pyright --version
            pytest --version
            ruff --version
            secretlint --version
            semgrep --version
            shellcheck --version
            shfmt --version
            stylelint --version
            v8r --version
            yamllint --version
            zizmor --version

            echo "== Frontend development tools =="
            (cd frontend && npm exec -- eslint --version)
            (cd frontend && npm exec -- prettier --version)
            (cd frontend && npm exec -- vite --version)

            echo "== Backend import =="
            python -c "import app.main"

            # Smoke check only - tests.yml runs the suite for real.
            echo "== Pytest collection =="
            python -m pytest --collect-only -q

            # The fragile part: Compose talking to the host daemon via DooD.
            echo "== Docker Compose stack =="
            docker compose up -d --build autoheal
            healthy=false
            for _ in $(seq 1 60); do
              if [ "$(docker inspect -f '{{.State.Health.Status}}' docker-autoheal 2>/dev/null)" = "healthy" ]; then
                healthy=true
                break
              fi
              sleep 2
            done
            if [ "$healthy" != "true" ]; then
              echo "::error::docker compose stack did not become healthy"
              docker compose logs
              docker compose down --remove-orphans
              exit 1
            fi
            echo "docker compose stack is healthy"
            docker compose down --remove-orphans
