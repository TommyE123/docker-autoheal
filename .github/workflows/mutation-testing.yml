name: Mutation Testing

# Informational only: never a required check, never a merge gate, and no
# mutation-score threshold. Runs the full suite on demand and on pull requests
# and pushes to main that change Python code or tests, or the mutation tooling.
# See docs/developer/mutation-testing.md for how to read the results.
on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**/*.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - "mutation.sh"
      - ".github/workflows/mutation-testing.yml"
      - "Dockerfile" # selects the Python version the job runs on
  # Runs on main keep the README status badge current: it shows the latest run
  # on the default branch, and pull request runs are not on that branch.
  push:
    branches:
      - main
    paths:
      - "app/**/*.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - "mutation.sh"
      - ".github/workflows/mutation-testing.yml"
      - "Dockerfile" # selects the Python version the job runs on
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. A new push to a pull request cancels that PR's in-progress
# run; runs on main and manual runs are never cancelled once running (a newer run
# can still replace one that is only queued), so the README badge reflects a run
# that finished.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The badge commit made by commit-badge below only changes
  # .github/badges/mutation.json, so a full mutation run on it would just
  # reproduce the score it already carries. Skip that run (and with it
  # commit-badge); the PR's other workflows still run for the commit. The pull
  # request checkout is a merge commit, so its second parent is the PR head.
  gate:
    name: Skip badge commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Is the head commit the badge commit?
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          skip=false
          if [ "$EVENT_NAME" = "pull_request" ] \
            && [ "$(git log -1 --format='%an|%s' HEAD^2)" = "github-actions[bot]|ci: update mutation badge" ]; then
            skip=true
            echo "The head commit is the mutation badge commit; skipping the mutation run."
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  mutation-testing:
    name: Mutmut
    needs: gate
    if: ${{ needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Python version the Dockerfile ships, as in tests.yml.
      - name: Determine Python version from Dockerfile
        id: python-version
        run: |
          VERSION=$(sed -n 's/^FROM python:\([0-9]\+\.[0-9]\+\)-slim.*/\1/p' Dockerfile | head -n1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not find a 'FROM python:X.Y-slim' line in Dockerfile" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python ${{ steps.python-version.outputs.version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.python-version.outputs.version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Deletes mutants/ first, so no earlier Mutmut state can be reused.
      - name: Run mutation testing
        run: ./mutation.sh

      # Runs only after a successful mutation run, so a failed run reports one
      # error instead of a second one from missing results.
      - name: Export results and summary
        run: |
          mutmut export-cicd-stats
          mutmut results > mutants/mutation-results.txt
          {
            echo "## Mutation testing"
            echo
            echo "Mutmut $(mutmut --version | awk '{print $NF}'), Python $(python -V | awk '{print $2}'), commit \`${GITHUB_SHA}\` (\`${GITHUB_REF}\`)"
            echo
            jq -r '
              "| Generated | Killed | Timeout | Survived | No tests | Detected |",
              "|---|---|---|---|---|---|",
              "| \(.total) | \(.killed) | \(.timeout) | \(.survived) | \(.no_tests) | \(((.killed + .timeout) / .total * 1000 | round) / 10)% |"
            ' mutants/mutmut-cicd-stats.json
            echo
            echo "Detected = (killed + timeout) / generated. It excludes FastAPI route handlers and every other decorated function, which Mutmut does not mutate."
            echo "Survivors are listed in \`mutation-results.txt\` in the \`mutation-results\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      # ./mutation.sh has just regenerated .github/badges/mutation.json with
      # `mutmut badge`. This job is read-only; for a pull request from this
      # repository the commit-badge job below commits the new file to the PR
      # branch, so here it only says whether the committed copy is stale.
      - name: Check the committed mutation badge
        run: |
          if [ -z "$(git status --porcelain -- .github/badges/mutation.json)" ]; then
            echo "The committed mutation badge is current."
          else
            echo "::notice title=Mutation badge out of date::The committed .github/badges/mutation.json differs from this run (mutation-badge artifact)."
            {
              echo
              echo "The committed README badge (\`.github/badges/mutation.json\`) does not match this run."
              echo "A successful run on a pull request from this repository commits the new file to the PR branch. The new file is in the \`mutation-badge\` artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload badge data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-badge
          path: .github/badges/mutation.json
          if-no-files-found: error

      - name: Upload mutation results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-results
          path: |
            mutants/
            !mutants/**/__pycache__/
            !mutants/data/
          if-no-files-found: warn

  # Commits the badge generated by the run above to the pull request branch, so
  # the PR that changes the score also changes the file. A separate job so that
  # only it holds a write token. It needs the mutation job to succeed, so a
  # failed run never updates the badge. Fork PRs are skipped: secrets are not
  # available to them. The commit is pushed with the BADGE_PUSH_TOKEN secret (a
  # fine-grained personal access token with Contents: read and write), not
  # GITHUB_TOKEN, because a GITHUB_TOKEN push does not start the PR's other
  # checks, which would leave the required ones missing on the new head. Those
  # checks run again for the badge commit; the gate job skips the mutation run
  # for it, so it does not loop.
  commit-badge:
    name: Commit mutation badge
    needs: mutation-testing
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      # The tip of the PR branch rather than the merge commit that was tested.
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.BADGE_PUSH_TOKEN }}

      - name: Download badge data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-badge
          path: .github/badges

      - name: Commit badge if changed
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "$(git status --porcelain -- .github/badges/mutation.json)" ]; then
            echo "The committed mutation badge is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/mutation.json
          git commit -m "ci: update mutation badge"
          git push origin "HEAD:refs/heads/${HEAD_REF}"
