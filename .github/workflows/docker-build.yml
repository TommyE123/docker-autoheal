name: Docker Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/docker-autoheal
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-autoheal
          cache-to: type=gha,mode=max,scope=docker-autoheal

      # sha-<short sha> is unambiguous: it's pushed above via metadata-action's
      # type=sha (keyed on this job's own github.sha), unlike pr-<N> which a
      # later commit on the same PR can overwrite before it's consumed.
      - name: Record the exact image reference for the smoke test
        id: image
        # Image references must be lowercase; github.repository_owner isn't
        # (metadata-action above lowercases it internally when tagging).
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ref=ghcr.io/${OWNER_LC}/docker-autoheal:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
    outputs:
      image_ref: ${{ steps.image.outputs.ref }}

  smoke-test:
    name: Production container smoke test
    needs: build
    # docker-build.yml only pushes an image for same-repo PRs; running this
    # job (which mounts the runner's Docker socket into the built image) for
    # anything else would be pulling nothing, or worse, an unrelated image.
    if: needs.build.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/production-smoke-test.yml
    with:
      image_ref: ${{ needs.build.outputs.image_ref }}
