name: Docker Build

# Pull requests build the production image once per architecture, nothing is pushed:
#   - build-amd64:     the linux/amd64 image, exported as an artifact for the tests.
#   - smoke-test:      the production checks and the full UI E2E suite on that artifact
#                      (production-smoke-test.yml).
#   - arm64-startup:   builds the linux/arm64 image under QEMU emulation, starts it and checks
#                      it is healthy.
# No registry or secrets are needed to run the tests, so it works the same for pull requests
# from forks. Releases are built and pushed by release-please.yml.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docker-build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The image the tests run on: linux/amd64 only, exported as an artifact.
  build-amd64:
    name: Build amd64 test image
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Docker Hub rate-limits (429) unauthenticated pulls from shared runner addresses
          # and these jobs pull the same base images in parallel. Try Google's public
          # mirror first; BuildKit falls back to Docker Hub for anything it does not have.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      # Authenticated pulls avoid Docker Hub's anonymous rate limit (429). Best effort: if the
      # login itself fails (a Docker Hub outage), carry on with anonymous pulls. Repo secrets are
      # not available to fork or Dependabot runs, which skip this and use the mirror instead.
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the amd64 image to a tarball
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: autoheal-test:amd64
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=docker-autoheal

      - name: Upload the image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image-amd64
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error

  smoke-test:
    name: Production container smoke test
    needs: build-amd64
    permissions:
      contents: read
    uses: ./.github/workflows/production-smoke-test.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # The arm64 image is built under QEMU emulation and only started, not put through the UI
  # suite: this catches an image that does not start on arm64 (a missing wheel or a base
  # image mismatch), not behaviour that differs on real arm64 hardware.
  arm64-startup:
    name: Start the arm64 image (QEMU)
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Docker Hub rate-limits (429) unauthenticated pulls from shared runner addresses
          # and these jobs pull the same base images in parallel. Try Google's public
          # mirror first; BuildKit falls back to Docker Hub for anything it does not have.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      # Authenticated pulls avoid Docker Hub's anonymous rate limit (429). Best effort: if the
      # login itself fails (a Docker Hub outage), carry on with anonymous pulls. Repo secrets are
      # not available to fork or Dependabot runs, which skip this and use the mirror instead.
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the arm64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: autoheal-test:arm64
          cache-from: type=gha,scope=docker-autoheal

      - name: Start the arm64 image
        run: |
          docker run -d --name autoheal-arm64 --platform linux/arm64 \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -p 3133:3131 \
            -e PYTHONUNBUFFERED=1 \
            autoheal-test:arm64
          echo "Architecture: $(docker inspect --format '{{.Architecture}}' autoheal-arm64)"

      # Emulation is slow, so allow far longer than the amd64 start.
      - name: Wait for the arm64 service to become healthy and reach Docker
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:3133/health >/dev/null \
              && curl -sf http://localhost:3133/api/status | jq -e '.docker_connected == true' >/dev/null 2>&1; then
              echo "arm64 image is healthy and connected to Docker"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The arm64 image never became healthy and connected to Docker"
          exit 1

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker ps -a
          docker logs autoheal-arm64 || true

      - name: Clean up
        if: always()
        run: docker rm -f autoheal-arm64 2>/dev/null || true
