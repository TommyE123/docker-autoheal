name: Docker Release

on:
  push:
    branches:
      - main

concurrency:
  group: docker-publish-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and release Docker image
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository so subsequent steps can access the code
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A previous run may have already tagged this exact commit (e.g. the
      # build/publish step failed and the workflow was re-run). Reuse that
      # tag instead of calculating a new one, so a retry never double-bumps.
      - name: Detect existing release for current commit
        id: existing
        run: |
          EXISTING_TAG="$(
            git tag --points-at "$GITHUB_SHA" \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1
          )"

          if [ -n "$EXISTING_TAG" ]; then
            echo "Existing release tag found on current commit: $EXISTING_TAG"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "tag=$EXISTING_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "No existing release tag found on current commit."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Calculate the next SemVer version from Conventional Commit messages
      # since the last release tag (fix -> patch, feat -> minor, a
      # "BREAKING CHANGE:" footer or "!" -> major), and push the new tag.
      # default_bump: false means a push with no fix/feat/breaking commit
      # (docs, chore, ci, test, style, refactor, ...) produces no release.
      - name: Determine next SemVer version
        id: tag_version
        if: steps.existing.outputs.found != 'true'
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: false

      # A single output used by every step below: the existing tag on a
      # retry, or the newly calculated one. Empty means no release this run.
      - name: Resolve release version
        id: resolve
        env:
          EXISTING_TAG: ${{ steps.existing.outputs.tag }}
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}
        run: |
          VERSION="${EXISTING_TAG:-$NEW_TAG}"
          if [ -z "$VERSION" ]; then
            echo "No fix/feat/breaking-change commit since the last release; nothing to release."
          else
            echo "Releasing ${VERSION}."
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Configure QEMU to support building images for multiple CPU architectures
      - name: Set up QEMU
        if: steps.resolve.outputs.version != ''
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      # Set up Docker Buildx builder for advanced multi-platform builds
      - name: Set up Docker Buildx
        if: steps.resolve.outputs.version != ''
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Authenticate to Docker Hub for pushing built images
      - name: Login to Docker Hub
        if: steps.resolve.outputs.version != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Authenticate to GitHub Container Registry (GHCR) for pushing images
      - name: Login to GHCR
        if: steps.resolve.outputs.version != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate image metadata and tags for Docker registries
      - name: Extract metadata
        if: steps.resolve.outputs.version != ''
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/docker-autoheal
            ghcr.io/${{ github.repository_owner }}/docker-autoheal
          tags: |
            type=raw,value=${{ steps.resolve.outputs.version }}
            type=raw,value=latest

      # Build the Docker image for multiple platforms and push to registries
      - name: Build and push Docker image
        if: steps.resolve.outputs.version != ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-autoheal
          cache-to: type=gha,mode=max,scope=docker-autoheal

      # Create a GitHub release entry for the new tag with generated notes
      - name: Create GitHub release
        if: steps.resolve.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.resolve.outputs.version }}
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG_NAME} already exists. Nothing to do."
            exit 0
          fi

          gh release create "${TAG_NAME}" \
            --verify-tag \
            --title "${TAG_NAME}" \
            --generate-notes

      # Update the repository description on Docker Hub using the README
      - name: Update Docker Hub description
        if: steps.resolve.outputs.version != ''
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/docker-autoheal
          readme-filepath: ./DOCKER_HUB_README.md
