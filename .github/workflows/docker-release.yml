name: Docker Release

on:
  push:
    branches:
      - main

concurrency:
  group: docker-publish-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and release Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Detect whether any valid v2.x.x tags exist
      - name: Detect existing v2 tags
        id: detect
        run: |
          if git tag --list | grep -Eq '^v2\.[0-9]+\.[0-9]+$'; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Calculate next version only if a v2.x.x tag already exists
      - name: Calculate next version (dry run)
        id: version
        if: steps.detect.outputs.found == 'true'
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          INITIAL_VERSION: 2.0.0
          TAG_PREFIX: v
          DRY_RUN: true
          VERBOSE: true

      # First release = v2.0.0
      - name: Set first version
        id: first
        if: steps.detect.outputs.found == 'false'
        run: |
          echo "new_tag=v2.0.0" >> "$GITHUB_OUTPUT"

      # Validate patch-only behaviour
      - name: Validate release version
        id: release_version
        env:
          CALCULATED_VERSION: ${{ steps.version.outputs.new_tag }}
          FIRST_VERSION: ${{ steps.first.outputs.new_tag }}
        run: |
          # First release path
          if [ -n "$FIRST_VERSION" ]; then
            echo "new_tag=$FIRST_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Must have a calculated version
          if [ -z "$CALCULATED_VERSION" ]; then
            echo "ERROR: github-tag-action did not calculate a release version."
            exit 1
          fi

          # Strict SemVer filter for v2.x.x tags
          LATEST_TAG="$(git tag --list | grep -E '^v2\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"

          if [[ ! "$LATEST_TAG" =~ ^v2\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "ERROR: Could not determine the latest valid v2.x.x tag."
            exit 1
          fi

          MINOR="${BASH_REMATCH[1]}"
          PATCH="${BASH_REMATCH[2]}"
          EXPECTED_VERSION="v2.${MINOR}.$((PATCH + 1))"

          echo "Latest tag:        $LATEST_TAG"
          echo "Calculated version: $CALCULATED_VERSION"
          echo "Expected version:   $EXPECTED_VERSION"

          if [ "$CALCULATED_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "ERROR: Release version must increment the patch number only."
            exit 1
          fi

          echo "new_tag=$CALCULATED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e0 # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/docker-autoheal
            ghcr.io/${{ github.repository_owner }}/docker-autoheal
          tags: |
            type=raw,value=${{ steps.release_version.outputs.new_tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-autoheal
          cache-to: type=gha,mode=max,scope=docker-autoheal

      - name: Create Git tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release_version.outputs.new_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${VERSION}"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "${VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release_version.outputs.new_tag }}
        run: |
          gh release create "${TAG_NAME}" \
            --verify-tag \
            --title "${TAG_NAME}" \
            --generate-notes

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/docker-autoheal
          readme-filepath: ./DOCKER_HUB_README.md
