name: Docker Release

on:
  push:
    branches:
      - main
  schedule:
    # Friday maintenance release check for accumulated release:none changes
    - cron: "0 9 * * 5"
  workflow_dispatch:
    inputs:
      release_type:
        description: "auto re-runs classification for the latest commit; maintenance runs the Friday sweep now (no manual patch/minor/major - every release traces to a merged PR's label)"
        type: choice
        default: auto
        options:
          - auto
          - maintenance

# Releases are serialised: two runs must never calculate or create the same
# version concurrently, and a run that may already have tagged is never cancelled.
concurrency:
  group: release-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Determine release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      issues: read

    outputs:
      release: ${{ steps.plan.outputs.release }}
      release_type: ${{ steps.plan.outputs.release_type }}
      version: ${{ steps.plan.outputs.version }}
      create_tag: ${{ steps.plan.outputs.create_tag }}
      already_released: ${{ steps.resume.outputs.already_released_tag }}

    steps:
      # push is already restricted to main by its own trigger, and schedule
      # always runs the default branch, but workflow_dispatch lets a caller pick
      # *any* ref to run this workflow against - without this, dispatching
      # "maintenance" against a feature branch would tag and publish that
      # unmerged commit, moving "latest" to code that was never reviewed.
      - name: Refuse releases from any ref other than main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Releases run only from main; this run's ref is ${REF}."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      # The release type comes from the merged pull request's label, the Friday
      # maintenance sweep, or an explicit manual request - never from the code,
      # the commit message or the pull request title.
      - name: Determine release mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED: ${{ github.event.inputs.release_type }}
        run: |
          MODE=classification

          case "$EVENT_NAME" in
            schedule)
              MODE=maintenance
              ;;
            workflow_dispatch)
              case "$REQUESTED" in
                auto) MODE=classification ;;
                maintenance) MODE=maintenance ;;
                *)
                  echo "::error::Unknown requested release type: ${REQUESTED}"
                  exit 1
                  ;;
              esac
              ;;
          esac

          echo "Release mode: ${MODE}"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"

      - name: Collect existing release tags
        run: git tag --merged HEAD > tags.txt

      # A release tag on this commit without a published GitHub Release means an
      # earlier attempt stopped part-way; that release is resumed with its
      # existing tag instead of a new version being calculated. A release tag
      # on this commit that *does* have a published GitHub Release means this
      # commit was already fully released: re-running the workflow (a manual
      # "re-run all jobs", or workflow_dispatch pointed at the same commit)
      # must recognise that and do nothing, never calculate the next version.
      - name: Detect an earlier release attempt on this commit
        id: resume
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESUME=""
          ALREADY_RELEASED=""

          # Detect if the current commit already has a release tag so the
          # per-tag check below can exempt the tag being resumed.
          for TAG in $(git tag --points-at "$GITHUB_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true); do
            RELEASE_IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo 'null')"
            if [ "$RELEASE_IS_DRAFT" = "false" ]; then
              echo "Release ${TAG} on this commit is already published."
              ALREADY_RELEASED="$TAG"
            else
              echo "Release ${TAG} on this commit has no published GitHub Release; it will be resumed."
              RESUME="$TAG"
            fi
          done

          # Every semantic tag except the one being resumed on this commit must
          # have a published GitHub Release.  An unpublished tag on any other
          # commit is a stalled partial release: proceeding past it would
          # permanently skip the changes it was meant to deliver.
          STALLED_TAGS=""
          for TAG in $(git tag --merged HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true); do
            RELEASE_IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo 'null')"
            if [ "$RELEASE_IS_DRAFT" != "false" ] && [ "$TAG" != "$RESUME" ]; then
              STALLED_TAGS="${STALLED_TAGS:+$STALLED_TAGS, }${TAG}"
            fi
          done

          if [ -n "$STALLED_TAGS" ]; then
            echo "::error::Release tag(s) ${STALLED_TAGS} have no published GitHub Release. Resume each (re-run their workflow run) before any new release can be calculated."
            exit 1
          fi

          echo "tag=${RESUME}" >> "$GITHUB_OUTPUT"
          echo "already_released_tag=${ALREADY_RELEASED}" >> "$GITHUB_OUTPUT"

      - name: Collect the release classification of all PRs since the latest release
        id: classification
        if: steps.mode.outputs.mode == 'classification'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the latest release tag as the boundary so every PR merged after
          # it is considered, not only PRs associated with GITHUB_SHA.  This
          # prevents a silent release loss when GitHub Actions concurrency
          # displaces a pending run: if PR B's run is replaced by PR C's run,
          # C's run finds both B and C here and uses the highest classification.
          LATEST_TAG="$(git tag --merged HEAD \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"

          if [ -z "$LATEST_TAG" ]; then
            BOUNDARY="1970-01-01T00:00:00Z"
          else
            BOUNDARY="$(git log -1 --format=%cI "$LATEST_TAG")"
          fi
          echo "Classification boundary: ${LATEST_TAG:-none} (${BOUNDARY})"

          # Collect all PRs merged into main since the latest release.
          # Use merged:>= to include PRs merged in the same second as the
          # boundary; the precise Python filter below is the authoritative check.
          gh api --method GET search/issues --paginate \
            -f "q=repo:${GITHUB_REPOSITORY} is:pr is:merged base:main merged:>=${BOUNDARY}" \
            --jq '.items[] | {number: .number, merged_at: .pull_request.merged_at}' \
            > classification-prs-meta.json

          jq -s '.' classification-prs-meta.json > classification-prs-meta-arr.json
          CANDIDATE_COUNT="$(jq 'length' classification-prs-meta-arr.json)"
          echo "Candidate PRs since ${LATEST_TAG:-none}: ${CANDIDATE_COUNT}"

          # Reconstruct labels from the GitHub Issues event log (append-only
          # audit record) at the moment each PR was merged, rather than
          # reading the current PR labels.  Any label change made after merge
          # is ignored, so the classification used here cannot be altered
          # after the PR passed the validate-release check.
          echo '[]' > classification-prs.json
          for i in $(seq 1 "${CANDIDATE_COUNT}"); do
            IDX=$((i - 1))
            PR_NUMBER="$(jq -r ".[$IDX].number" classification-prs-meta-arr.json)"
            MERGED_AT="$(jq -r ".[$IDX].merged_at" classification-prs-meta-arr.json)"

            # Precise boundary check: skip PRs merged at or before the boundary.
            printf '%s\n' 'import os,datetime as D' \
              'm=D.datetime.fromisoformat(os.environ["MERGED_AT"].replace("Z","+00:00"))' \
              'b=D.datetime.fromisoformat(os.environ["BOUNDARY"].replace("Z","+00:00"))' \
              'print("true"if m>b else"false")' \
              > /tmp/_br.py
            AFTER_BOUNDARY="$(MERGED_AT="${MERGED_AT}" BOUNDARY="${BOUNDARY}" python3 /tmp/_br.py)"
            rm -f /tmp/_br.py
            if [ "$AFTER_BOUNDARY" != "true" ]; then
              echo "PR #${PR_NUMBER} merged at ${MERGED_AT} is not after boundary; skipping"
              continue
            fi

            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/events" \
              --paginate > "pr-${PR_NUMBER}-events.json"

            PR_LABELS="$(python3 -m scripts.release.cli resolve-labels \
              --events-file "pr-${PR_NUMBER}-events.json" \
              --merged-at "${MERGED_AT}")"

            jq --argjson pr_number "${PR_NUMBER}" --argjson pr_labels "${PR_LABELS}" \
              '. + [{"number": $pr_number, "labels": $pr_labels}]' classification-prs.json \
              > classification-prs-upd.json && mv classification-prs-upd.json classification-prs.json
          done

          COUNT="$(jq 'length' classification-prs.json)"
          echo "Pull requests after precise filter: ${COUNT}"
          jq -r '.[] | "  #\(.number) \(.labels | join(", "))"' classification-prs.json

      # Only pull requests merged after the latest successful release are
      # considered, so changes already included in an earlier release are
      # never released a second time. This is one search query bounded by
      # that release's commit timestamp rather than a GitHub API call per
      # commit since, so it stays cheap no matter how many commits sit
      # between releases.
      - name: Collect unreleased release:none pull requests
        if: steps.mode.outputs.mode == 'maintenance'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG="$(git tag --merged HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"

          if [ -z "$LATEST_TAG" ]; then
            echo "::error::No release tag found; cannot determine the maintenance release boundary."
            exit 1
          fi

          BOUNDARY="$(git log -1 --format=%cI "$LATEST_TAG")"
          echo "Latest release: ${LATEST_TAG} (${BOUNDARY})"

          # Collect each merged PR's number and merge timestamp; labels are
          # resolved below from the Issues Events API rather than from the
          # current PR state, so classification is immutable after merge.
          # Use merged:>= to get a candidate superset that includes PRs merged
          # at exactly the boundary second; each candidate is then compared
          # precisely below to exclude PRs merged at or before the boundary.
          gh api --method GET search/issues --paginate \
            -f "q=repo:${GITHUB_REPOSITORY} is:pr is:merged base:main merged:>=${BOUNDARY}" \
            --jq '.items[] | {number: .number, merged_at: .pull_request.merged_at}' \
            > merged-pr-lines.json

          jq -s '.' merged-pr-lines.json > merged-prs-meta.json
          CANDIDATE_COUNT="$(jq 'length' merged-prs-meta.json)"
          echo "Candidate pull requests since ${LATEST_TAG} (before precise filter): ${CANDIDATE_COUNT}"

          # Reconstruct labels from the GitHub Issues event log (append-only
          # audit record) at the moment each PR was merged, rather than
          # reading the current PR labels.  Any label change made after merge
          # is ignored, so the classification used here cannot be altered
          # after the PR passed the validate-release check.
          echo '[]' > maintenance-prs.json
          for i in $(seq 1 "${CANDIDATE_COUNT}"); do
            IDX=$((i - 1))
            PR_NUMBER="$(jq -r ".[$IDX].number" merged-prs-meta.json)"
            MERGED_AT="$(jq -r ".[$IDX].merged_at" merged-prs-meta.json)"

            # Precise boundary check: skip PRs merged at or before the boundary.
            # The search uses merged:>= to avoid missing PRs in the same second,
            # so this comparison is the authoritative filter.
            printf '%s\n' 'import os,datetime as D' \
              'm=D.datetime.fromisoformat(os.environ["MERGED_AT"].replace("Z","+00:00"))' \
              'b=D.datetime.fromisoformat(os.environ["BOUNDARY"].replace("Z","+00:00"))' \
              'print("true"if m>b else"false")' \
              > /tmp/_br.py
            AFTER_BOUNDARY="$(MERGED_AT="${MERGED_AT}" BOUNDARY="${BOUNDARY}" python3 /tmp/_br.py)"
            rm -f /tmp/_br.py
            if [ "$AFTER_BOUNDARY" != "true" ]; then
              echo "PR #${PR_NUMBER} merged at ${MERGED_AT} is not after boundary ${BOUNDARY}; skipping"
              continue
            fi

            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/events" \
              --paginate > "pr-${PR_NUMBER}-events.json"

            PR_LABELS="$(python3 -m scripts.release.cli resolve-labels \
              --events-file "pr-${PR_NUMBER}-events.json" \
              --merged-at "${MERGED_AT}")"

            jq --argjson pr_number "${PR_NUMBER}" --argjson pr_labels "${PR_LABELS}" \
              '. + [{"number": $pr_number, "labels": $pr_labels}]' maintenance-prs.json \
              > maintenance-prs-updated.json && mv maintenance-prs-updated.json maintenance-prs.json
          done
          COUNT="$(jq 'length' maintenance-prs.json)"
          echo "Merged pull requests since ${LATEST_TAG}: ${COUNT}"
          jq -r '.[] | "  #\(.number) \(.labels | join(", "))"' maintenance-prs.json

      - name: Plan release
        id: plan
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          RESUME_TAG: ${{ steps.resume.outputs.tag }}
          ALREADY_RELEASED_TAG: ${{ steps.resume.outputs.already_released_tag }}
        run: |
          RESUME_ARGS=()
          if [ -n "$RESUME_TAG" ]; then
            RESUME_ARGS=(--resume-tag "$RESUME_TAG")
          fi
          if [ -n "$ALREADY_RELEASED_TAG" ]; then
            RESUME_ARGS+=(--already-released-tag "$ALREADY_RELEASED_TAG")
          fi

          if [ "$MODE" = "maintenance" ]; then
            python3 -m scripts.release.cli plan-maintenance \
              --pull-requests-file maintenance-prs.json \
              --tags-file tags.txt \
              "${RESUME_ARGS[@]}"
          else
            python3 -m scripts.release.cli plan-push \
              --pull-requests-file classification-prs.json \
              --tags-file tags.txt \
              "${RESUME_ARGS[@]}"
          fi

  release:
    name: Build and release Docker image
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      issues: read

    steps:
      # Defence in depth: the plan job already refuses to run outside main, so
      # this job never starts unless plan succeeded - but a release this
      # dangerous is worth asserting twice rather than trusting the chain.
      - name: Refuse releases from any ref other than main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Releases run only from main; this run's ref is ${REF}."
            exit 1
          fi

      # Checkout the repository so subsequent steps can access the code
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Collect existing release tags
        run: git tag --merged HEAD > tags.txt

      # Replace scripts/ with a trusted revision's copy so a PR that modifies
      # scripts/release/ cannot weaken its own release-time validator.
      # For push events the trusted revision is github.event.before: the main
      # tip before the update.  HEAD^ is unsafe — a rebase merge places in-PR
      # commits at HEAD^, so a multi-commit PR could put its own modified
      # scripts/ there.  github.event.before is always the pre-push main tip,
      # regardless of merge strategy.  For schedule and workflow_dispatch,
      # HEAD is already validated (each push to main used github.event.before).
      - name: Fetch trusted release tooling from pre-push main tip
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" != "push" ]; then
            echo "Non-push trigger: using scripts/ already on main HEAD."
            exit 0
          fi
          if [ -z "$BEFORE_SHA" ] || \
             [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::github.event.before is empty or null SHA; cannot determine trusted tooling revision."
            exit 1
          fi
          if ! git cat-file -e "${BEFORE_SHA}:scripts" 2>/dev/null; then
            echo "::error::scripts/ not present at trusted revision ${BEFORE_SHA}; cannot perform trusted re-validation."
            exit 1
          fi
          git checkout "$BEFORE_SHA" -- scripts/

      # Re-derive the release plan from scratch using trusted (parent-commit)
      # scripts and raw GitHub API data.  verify-release only validates version
      # arithmetic; it accepts any release_type the plan job passes in.  A PR
      # that modifies scripts/release/ could therefore make plan-push emit
      # release_type=major and have verify-release accept it.  This step re-runs
      # the full PR collection and plan-push/plan-maintenance with trusted scripts
      # and cross-checks the result against the plan job outputs, refusing to
      # proceed if they differ.
      - name: Re-derive release plan with trusted tooling and cross-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED: ${{ github.event.inputs.release_type }}
          PLAN_RELEASE_TYPE: ${{ needs.plan.outputs.release_type }}
          PLAN_VERSION: ${{ needs.plan.outputs.version }}
          PLAN_CREATE_TAG: ${{ needs.plan.outputs.create_tag }}
        run: |
          # Derive mode from GitHub trigger inputs — these are GitHub-controlled
          # and cannot be influenced by candidate code.
          MODE=classification
          case "$EVENT_NAME" in
            schedule) MODE=maintenance ;;
            workflow_dispatch)
              [ "$REQUESTED" = "maintenance" ] && MODE=maintenance ;;
          esac

          # Re-check resume/already-released by inspecting this commit's tags
          # directly, independent of the plan job outputs.
          RESUME_TAG=""
          ALREADY_RELEASED_TAG=""
          for TAG in $(git tag --points-at "$GITHUB_SHA" \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true); do
            IS_DRAFT="$(gh release view "$TAG" \
              --json isDraft --jq '.isDraft' 2>/dev/null || echo 'null')"
            if [ "$IS_DRAFT" = "false" ]; then
              ALREADY_RELEASED_TAG="$TAG"
            else
              RESUME_TAG="$TAG"
            fi
          done
          RESUME_ARGS=()
          [ -n "$RESUME_TAG" ] && RESUME_ARGS+=(--resume-tag "$RESUME_TAG")
          [ -n "$ALREADY_RELEASED_TAG" ] \
            && RESUME_ARGS+=(--already-released-tag "$ALREADY_RELEASED_TAG")

          # Boundary: latest semantic release tag reachable from HEAD
          LATEST_TAG="$(git tag --merged HEAD \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [ "$MODE" = "maintenance" ] \
              && [ -z "$LATEST_TAG" ] \
              && [ -z "$RESUME_TAG" ] \
              && [ -z "$ALREADY_RELEASED_TAG" ]; then
            echo "::error::No release tag found; cannot determine maintenance boundary."
            exit 1
          fi
          if [ -z "$LATEST_TAG" ]; then
            BOUNDARY="1970-01-01T00:00:00Z"
          else
            BOUNDARY="$(git log -1 --format=%cI "$LATEST_TAG")"
          fi

          # Re-collect all PRs since boundary using the same API approach as the
          # plan job, but processing with trusted parent-commit scripts.
          echo '[]' > /tmp/_tr_prs.json
          gh api --method GET search/issues --paginate \
            -f "q=repo:${GITHUB_REPOSITORY} is:pr is:merged base:main merged:>=${BOUNDARY}" \
            --jq '.items[] | {number:.number, merged_at:.pull_request.merged_at}' \
            | jq -s '.' > /tmp/_tr_meta.json
          COUNT="$(jq 'length' /tmp/_tr_meta.json)"
          for i in $(seq 1 "$COUNT"); do
            IDX=$((i - 1))
            PR_N="$(jq -r ".[$IDX].number" /tmp/_tr_meta.json)"
            MERGED_AT="$(jq -r ".[$IDX].merged_at" /tmp/_tr_meta.json)"
            printf '%s\n' 'import os,datetime as D' \
              'm=D.datetime.fromisoformat(os.environ["MERGED_AT"].replace("Z","+00:00"))' \
              'b=D.datetime.fromisoformat(os.environ["BOUNDARY"].replace("Z","+00:00"))' \
              'print("true"if m>b else"false")' > /tmp/_tr_br.py
            AFTER="$(MERGED_AT="$MERGED_AT" BOUNDARY="$BOUNDARY" python3 /tmp/_tr_br.py)"
            rm -f /tmp/_tr_br.py
            [ "$AFTER" = "true" ] || continue
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_N}/events" \
              --paginate > "/tmp/_tr_ev_${PR_N}.json"
            LABELS="$(python3 -m scripts.release.cli resolve-labels \
              --events-file "/tmp/_tr_ev_${PR_N}.json" --merged-at "$MERGED_AT")"
            jq --argjson n "$PR_N" --argjson l "$LABELS" \
              '. + [{"number":$n,"labels":$l}]' /tmp/_tr_prs.json \
              > /tmp/_tr_upd.json && mv /tmp/_tr_upd.json /tmp/_tr_prs.json
          done

          # Run trusted plan-push or plan-maintenance with parent-commit scripts
          if [ "$MODE" = "maintenance" ]; then
            TRUSTED_OUT="$(python3 -m scripts.release.cli plan-maintenance \
              --pull-requests-file /tmp/_tr_prs.json \
              --tags-file tags.txt "${RESUME_ARGS[@]}")"
          else
            TRUSTED_OUT="$(python3 -m scripts.release.cli plan-push \
              --pull-requests-file /tmp/_tr_prs.json \
              --tags-file tags.txt "${RESUME_ARGS[@]}")"
          fi

          TRUSTED_RT="$(echo "$TRUSTED_OUT" | grep '^release_type=' | cut -d= -f2)"
          TRUSTED_VER="$(echo "$TRUSTED_OUT" | grep '^version=' | cut -d= -f2)"
          TRUSTED_CT="$(echo "$TRUSTED_OUT" | grep '^create_tag=' | cut -d= -f2)"

          # Cross-check: trusted re-plan must agree with plan job outputs.
          # A mismatch means the plan job used modified scripts/ to inflate the
          # release classification beyond what PR labels authorise.
          MISMATCH=false
          if [ "$TRUSTED_RT" != "$PLAN_RELEASE_TYPE" ]; then
            echo "::error::release_type mismatch: trusted=${TRUSTED_RT}, plan=${PLAN_RELEASE_TYPE}"
            MISMATCH=true
          fi
          if [ "$TRUSTED_VER" != "$PLAN_VERSION" ]; then
            echo "::error::version mismatch: trusted=${TRUSTED_VER}, plan=${PLAN_VERSION}"
            MISMATCH=true
          fi
          if [ "$TRUSTED_CT" != "$PLAN_CREATE_TAG" ]; then
            echo "::error::create_tag mismatch: trusted=${TRUSTED_CT}, plan=${PLAN_CREATE_TAG}"
            MISMATCH=true
          fi
          if [ "$MISMATCH" = "true" ]; then
            echo "::error::Refusing to proceed: plan job outputs do not match trusted re-plan."
            exit 1
          fi
          echo "Trusted re-plan agrees: release_type=${TRUSTED_RT}, version=${TRUSTED_VER}, create_tag=${TRUSTED_CT}"

      # The Git references API refuses to create a reference that already exists.
      # That conflict is a hard safety boundary: the release fails rather than
      # moving, deleting or force-pushing an existing release tag.
      - name: Create release tag
        if: needs.plan.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${VERSION}" \
            -f "sha=${GITHUB_SHA}"

      - name: Verify the release tag points at this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          TAGGED_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" --jq '.object.sha')"

          if [ "$TAGGED_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Release tag ${VERSION} points at ${TAGGED_SHA}, not ${GITHUB_SHA}."
            exit 1
          fi

          echo "Release tag ${VERSION} points at ${GITHUB_SHA}."

      # Configure QEMU to support building images for multiple CPU architectures
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      # Set up Docker Buildx builder for advanced multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Authenticate to Docker Hub for pushing built images
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Authenticate to GitHub Container Registry (GHCR) for pushing images
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate image metadata and tags for Docker registries
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/docker-autoheal
            ghcr.io/${{ github.repository_owner }}/docker-autoheal
          tags: |
            type=raw,value=${{ needs.plan.outputs.version }}

      # Build the Docker image for multiple platforms and push to registries
      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-autoheal
          cache-to: type=gha,mode=max,scope=docker-autoheal

      # Create a GitHub release entry for the new tag with generated notes
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.plan.outputs.version }}
        run: |
          RELEASE_IS_DRAFT="$(gh release view "${TAG_NAME}" --json isDraft --jq '.isDraft' 2>/dev/null || echo 'null')"
          if [ "$RELEASE_IS_DRAFT" = "false" ]; then
            echo "GitHub Release ${TAG_NAME} is already published. Nothing to do."
            exit 0
          elif [ "$RELEASE_IS_DRAFT" = "true" ]; then
            echo "GitHub Release ${TAG_NAME} is a draft; publishing it now."
            gh release edit "${TAG_NAME}" --draft=false
          else
            gh release create "${TAG_NAME}" \
              --verify-tag \
              --title "${TAG_NAME}" \
              --generate-notes
          fi

  promote_latest:
    name: Promote latest tag
    runs-on: ubuntu-latest
    # Run when a new release just published successfully, or when the commit
    # is already fully released (already_released) so a rerun after a failed
    # latest-promotion can complete the step without re-publishing images or
    # creating a second GitHub Release.
    needs: [plan, release]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.release.result == 'success' ||
       needs.plan.outputs.already_released != '')

    permissions:
      contents: read
      packages: write

    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}

    steps:
      - name: Refuse releases from any ref other than main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Releases run only from main; this run's ref is ${REF}."
            exit 1
          fi

      # For a normal release, the version comes from the plan.  For an
      # already-released re-run, plan.outputs.version is empty because no new
      # version was calculated; use already_released instead.
      - name: Resolve version to promote
        id: version
        env:
          ALREADY_RELEASED: ${{ needs.plan.outputs.already_released }}
          PLANNED_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          VERSION="${ALREADY_RELEASED:-$PLANNED_VERSION}"
          if [ -z "$VERSION" ]; then
            echo "::error::No version to promote to latest."
            exit 1
          fi
          echo "Promoting ${VERSION} to latest."
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote latest tag
        id: promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Guard: only promote when this version is still the newest published
          # release.  A re-run of an older completed workflow must not downgrade
          # :latest when a newer release has since been published.
          NEWEST="$(gh release list \
            --exclude-drafts --exclude-pre-releases \
            --limit 100 \
            --json tagName \
            --jq '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || echo '')"

          if [ -z "$NEWEST" ]; then
            echo "::error::No published GitHub Release found; cannot determine the newest release."
            exit 1
          fi

          if [ "$VERSION" != "$NEWEST" ]; then
            echo "Skipping: ${VERSION} is not the newest published release (${NEWEST} is); :latest already points at a newer release."
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docker buildx imagetools create \
            --tag "docker.io/${DOCKERHUB_USERNAME}/docker-autoheal:latest" \
            "docker.io/${DOCKERHUB_USERNAME}/docker-autoheal:${VERSION}"

          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository_owner }}/docker-autoheal:latest" \
            "ghcr.io/${{ github.repository_owner }}/docker-autoheal:${VERSION}"

          echo "promoted=true" >> "$GITHUB_OUTPUT"

  update-hub-description:
    name: Update Docker Hub description
    runs-on: ubuntu-latest
    # Run only when latest was actually promoted (not when the newest-release
    # guard skipped an older rerun), so we never overwrite the description with
    # an older revision of DOCKER_HUB_README.md.
    needs: [promote_latest]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.promote_latest.result == 'success' &&
      needs.promote_latest.outputs.promoted == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/docker-autoheal
          readme-filepath: ./DOCKER_HUB_README.md
