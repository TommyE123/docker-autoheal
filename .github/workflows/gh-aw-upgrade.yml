name: Upgrade gh-aw

# Runs `gh aw upgrade` on main and, only if something wanted changes, opens a
# normal PR for it. The Gemini CLI version pinned in issue-triage.md is bumped
# first, so the same run recompiles the lock file against it (Renovate cannot
# recompile it). Triggered by cron-job.org through workflow_dispatch (no
# GitHub Actions schedule here); can also be run by hand. See #384.
on: # yamllint disable-line rule:truthy
  workflow_dispatch:

permissions: {}

# A second dispatch waits instead of racing the first to open the same upgrade PR.
concurrency:
  group: gh-aw-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    name: Upgrade gh-aw
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # GH_AW_UPGRADE_TOKEN is a fine-grained PAT (this repo only: contents,
      # pull requests and workflows read/write). The default GITHUB_TOKEN cannot
      # be granted `workflows`, which GitHub requires to push a recompiled
      # *.lock.yml, and PRs/pushes made with it do not trigger CI. checkout
      # persists the PAT as the git credential used by the push below.
      - name: Checkout main # zizmor: ignore[artipacked] - the push below reuses the persisted PAT, see comment above.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.GH_AW_UPGRADE_TOKEN }}
          persist-credentials: true # The push below reuses this credential.

      # Branches are named chore/upgrade-gh-aw-<version> below, so any open PR
      # from such a branch is an upgrade PR that is still waiting for review.
      - name: Check for an open upgrade PR
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GH_AW_UPGRADE_TOKEN }}
        run: |
          number=$(gh pr list --state open --limit 100 --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("chore/upgrade-gh-aw-")) | .number] | first // empty')
          if [ -n "$number" ]; then
            echo "Skipping: upgrade PR #$number is already open"
          fi
          echo "pr=$number" >> "$GITHUB_OUTPUT"

      # The pin in .github/aw/actions-lock.json is for the setup action used by
      # compiled workflows, not a CLI installer, so use the documented
      # standalone installer (always the latest release).
      - name: Install gh-aw CLI
        if: steps.existing.outputs.pr == ''
        run: |
          curl -fsSL -o "$RUNNER_TEMP/install-gh-aw.sh" https://raw.githubusercontent.com/github/gh-aw/main/install-gh-aw.sh
          bash "$RUNNER_TEMP/install-gh-aw.sh"

      # engine.version in issue-triage.md is not touched by `gh aw upgrade`, and
      # Renovate cannot recompile the lock file, so bump it here and let the
      # upgrade step below recompile. Only stable releases at least
      # MIN_AGE_DAYS old are eligible, matching NPM_CONFIG_MIN_RELEASE_AGE in the
      # lock file, which would refuse a newer version at install time.
      - name: Bump the Gemini CLI pin
        id: gemini
        if: steps.existing.outputs.pr == ''
        env:
          MIN_AGE_DAYS: "3"
        run: |
          set -euo pipefail
          file=.github/workflows/issue-triage.md
          current=$(sed -nE 's/^  version: "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' "$file")
          if [ "$(printf '%s\n' "$current" | grep -c .)" != 1 ]; then
            echo "::error::expected exactly one 'version: \"x.y.z\"' line in $file"
            exit 1
          fi
          latest=$(npm view @google/gemini-cli time --json | CURRENT="$current" node -e '
            const times = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const cutoff = Date.now() - Number(process.env.MIN_AGE_DAYS) * 864e5;
            const parts = (v) => v.split(".").map(Number);
            const newer = (a, b) => {
              const [x, y] = [parts(a), parts(b)];
              for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] > y[i];
              return false;
            };
            let best = process.env.CURRENT;
            for (const [v, when] of Object.entries(times)) {
              if (/^\d+\.\d+\.\d+$/.test(v) && Date.parse(when) <= cutoff && newer(v, best)) best = v;
            }
            console.log(best);
          ')
          [ -n "$latest" ] || { echo "::error::could not work out the latest Gemini CLI version"; exit 1; }
          echo "Gemini CLI pin: $current, newest eligible: $latest"
          if [ "$latest" != "$current" ]; then
            sed -i -E "s/^(  version: \")[0-9.]+(\")$/\1$latest\2/" "$file"
            echo "version=$latest" >> "$GITHUB_OUTPUT"
          fi

      # `gh aw upgrade` generates a skill file this repo does not keep; it is
      # removed if present. Nothing is branched, committed or pushed here. Only the files gh-aw manages are staged (the
      # gh-aw actions lock, workflow sources it applies codemods to, and
      # compiled lock files); any other change, including a new generated
      # artefact, fails the job.
      - name: Upgrade gh-aw and drop unwanted artefacts
        id: upgrade
        if: steps.existing.outputs.pr == ''
        env:
          GH_TOKEN: ${{ secrets.GH_AW_UPGRADE_TOKEN }}
          GEMINI_VERSION: ${{ steps.gemini.outputs.version }}
        run: |
          set -euo pipefail
          version=$(gh aw --version 2>&1 | awk '{print $NF}')
          [ -n "$version" ] || { echo "::error::could not read the gh-aw version"; exit 1; }
          echo "gh-aw $version"
          previous=$(grep -m1 -oE '"compiler_version":"[^"]+"' .github/workflows/issue-triage.lock.yml | cut -d'"' -f4)
          gh aw upgrade

          rm -f -- .github/skills/agentic-workflows/SKILL.md

          git add -- .github/aw '.github/workflows/*.md' '.github/workflows/*.lock.yml'
          unexpected=$(git diff --name-only; git ls-files --others --exclude-standard)
          if [ -n "$unexpected" ]; then
            echo "::error::gh aw upgrade changed files outside the managed set:"
            echo "$unexpected"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "gh-aw is already current; nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # The branch keeps the chore/upgrade-gh-aw- prefix that the open-PR check
          # above looks for. The title and body say which of the two changed.
          note=""
          if [ -n "$GEMINI_VERSION" ]; then
            note="The Gemini CLI pin in issue-triage.md is now $GEMINI_VERSION."
            note="$note CI cannot show that it still authenticates under the current AWF,"
            note="$note so run issue-triage once from this branch before merging."
          fi
          if [ "$version" != "$previous" ] && [ -n "$GEMINI_VERSION" ]; then
            branch="chore/upgrade-gh-aw-$version-gemini-cli-$GEMINI_VERSION"
            title="chore: upgrade agentic workflows to $version and Gemini CLI to $GEMINI_VERSION"
          elif [ -n "$GEMINI_VERSION" ]; then
            branch="chore/upgrade-gh-aw-gemini-cli-$GEMINI_VERSION"
            title="chore: upgrade the issue-triage Gemini CLI to $GEMINI_VERSION"
          else
            branch="chore/upgrade-gh-aw-$version"
            title="chore: upgrade agentic workflows to $version"
          fi
          {
            echo "branch=$branch"
            echo "title=$title"
            echo "note=$note"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Create upgrade PR
        if: steps.existing.outputs.pr == '' && steps.upgrade.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_AW_UPGRADE_TOKEN }}
          VERSION: ${{ steps.upgrade.outputs.version }}
          BRANCH: ${{ steps.upgrade.outputs.branch }}
          TITLE: ${{ steps.upgrade.outputs.title }}
          NOTE: ${{ steps.upgrade.outputs.note }}
        run: |
          branch="$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "$TITLE"
          # No upgrade PR is open (checked above), so a same-named remote branch
          # is a leftover from a PR that was closed without merging: replace it.
          git push --force -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "$TITLE" \
            --body "Automatically generated by the Upgrade gh-aw workflow (gh aw upgrade, gh-aw $VERSION). Review the generated workflow and lock file changes as normal. $NOTE"
