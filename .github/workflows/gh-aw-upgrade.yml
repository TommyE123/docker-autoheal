name: Upgrade gh-aw

# Runs the official `gh aw upgrade --create-pull-request` and lets gh-aw decide
# whether an update is required. Phase 1 of #384: manual dispatch only.
on: # yamllint disable-line rule:truthy
  workflow_dispatch:

permissions: {}

jobs:
  upgrade:
    name: Run gh aw upgrade
    runs-on: ubuntu-latest
    # Provisional - narrow once the first real run shows what is required.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fine-grained PAT (this repo only: contents, pull requests and
          # workflows read/write). The default GITHUB_TOKEN cannot be granted
          # `workflows`, which GitHub requires to push the recompiled
          # *.lock.yml. checkout persists it as the git credential that
          # gh-aw's own `git push` uses, and pushes/PRs made with a PAT (unlike
          # GITHUB_TOKEN) trigger the normal CI workflows.
          token: ${{ secrets.GH_AW_UPGRADE_TOKEN }}

      # The pin in .github/aw/actions-lock.json is for the reusable setup
      # action used by compiled workflows, not a CLI installer, so use the
      # documented standalone installer (always the latest release).
      - name: Install gh-aw CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/install-gh-aw.sh" https://raw.githubusercontent.com/github/gh-aw/main/install-gh-aw.sh
          bash "$RUNNER_TEMP/install-gh-aw.sh"

      - name: Verify gh-aw supports --create-pull-request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh aw --version
          help_output=$(gh aw upgrade --help 2>&1)
          echo "$help_output"
          if ! grep -q -- '--create-pull-request' <<<"$help_output"; then
            echo "::error::Installed gh-aw does not support 'upgrade --create-pull-request'"
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # TEMPORARY WORKAROUND: `gh aw upgrade` unconditionally generates Copilot
      # artefacts even for this repo's gemini engine, and pushing the workflow
      # file among them needs a `workflows` permission GITHUB_TOKEN cannot
      # have. gh-aw commits and pushes inside the same command, so remove them
      # with a runner-only pre-commit hook. The hook fails (aborting the commit)
      # if gh-aw stops generating them, so this does not silently go stale.
      - name: Install pre-commit hook to drop Copilot artefacts
        run: |
          cat > .git/hooks/pre-commit <<'HOOK'
          #!/usr/bin/env bash
          set -euo pipefail
          files=(.github/agents/agentic-workflows.md .github/workflows/copilot-setup-steps.yml)
          for f in "${files[@]}"; do
            if [ ! -e "$f" ]; then
              echo "::error::gh-aw did not generate $f. gh-aw may have stopped generating its Copilot artefacts; review and remove this cleanup workaround." >&2
              exit 1
            fi
          done
          git rm -f -q -- "${files[@]}"
          HOOK
          chmod +x .git/hooks/pre-commit

      # gh-aw opens a new PR (on a fresh random branch) every run, so skip
      # the upgrade while one is still open. The branch prefix is what gh-aw
      # currently uses; if it changes this check stops matching.
      - name: Check for an open upgrade PR
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GH_AW_UPGRADE_TOKEN }}
        run: |
          number=$(gh pr list --state open --limit 100 --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("upgrade-agentic-workflows-")) | .number] | first // empty')
          if [ -n "$number" ]; then
            echo "Skipping upgrade: upgrade PR #$number is already open"
          fi
          echo "pr=$number" >> "$GITHUB_OUTPUT"

      - name: Upgrade gh-aw
        if: steps.existing.outputs.pr == ''
        env:
          # gh API auth for gh-aw's `gh pr create` (git push auth comes from
          # the checkout step above).
          GH_TOKEN: ${{ secrets.GH_AW_UPGRADE_TOKEN }}
        run: gh aw upgrade --create-pull-request

      # gh-aw titles its PR "Upgrade agentic workflows", which fails the
      # Conventional Commits title check; retitling re-runs that check.
      - name: Retitle the upgrade PR
        if: steps.existing.outputs.pr == ''
        env:
          GH_TOKEN: ${{ secrets.GH_AW_UPGRADE_TOKEN }}
        run: |
          number=$(gh pr list --state open --limit 100 --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("upgrade-agentic-workflows-")) | .number] | first // empty')
          if [ -z "$number" ]; then
            echo "No upgrade PR was created; nothing to retitle"
            exit 0
          fi
          gh pr edit "$number" --title "chore: upgrade agentic workflows"
