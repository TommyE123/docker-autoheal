name: Welcome

on:
  pull_request_target:
    types:
      - opened

permissions:
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest

    steps:
      - name: Greet first-time contributors
        uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          pr_message: >
            👋 Thanks for your first pull request to docker-autoheal!


            We really appreciate you taking the time to contribute. A
            maintainer will review your PR as soon as possible.


            In the meantime, please make sure the tests are passing and that
            the PR description clearly explains the change. Thanks for
            helping improve the project! ❤️
