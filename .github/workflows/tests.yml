name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # Skips the jobs below for the automated mutation badge PR (badge file only). If this job
  # itself fails, badge-only is empty and they run. See badge-only-check.yml.
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/badge-only-check.yml

  # Required check. Always runs: a badge-only PR only validates the badge file (a failure fails
  # the job); every other PR, and any PR whose detection failed, runs the full suite.
  unit-tests:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the mutation badge file
        if: ${{ needs.changes.outputs.badge-only == 'true' }}
        run: .github/scripts/validate-badge.sh

      # Test against the same Python version the Dockerfile actually ships.
      - name: Determine Python version from Dockerfile
        id: python-version
        if: ${{ needs.changes.outputs.badge-only != 'true' }}
        run: |
          VERSION=$(sed -n 's/^FROM python:\([0-9]\+\.[0-9]\+\)-slim.*/\1/p' Dockerfile | head -n1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not find a 'FROM python:X.Y-slim' line in Dockerfile" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python ${{ steps.python-version.outputs.version }}
        if: ${{ needs.changes.outputs.badge-only != 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.python-version.outputs.version }}
          cache: pip

      - name: Install dependencies
        if: ${{ needs.changes.outputs.badge-only != 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        if: ${{ needs.changes.outputs.badge-only != 'true' }}
        run: pytest --cov --cov-branch --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && needs.changes.outputs.badge-only != 'true' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results

      - name: Upload coverage reports to Codecov
        if: ${{ needs.changes.outputs.badge-only != 'true' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: coverage

  frontend-tests:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.badge-only != 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() && hashFiles('frontend/coverage/lcov.info') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          report_type: coverage
