name: Badge-only Change Check

# Called as the `changes` job by tests.yml, docker-build.yml and mega-linter.yml so they can
# skip their jobs for the automated mutation badge PR. `badge-only` is "true" only for a pull
# request whose changed files are all .github/badges/mutation.json; any other event, any other
# file, an empty list or an API error gives "false" and the normal checks run.
on: # yamllint disable-line rule:truthy
  workflow_call:
    outputs:
      badge-only:
        value: ${{ jobs.detect.outputs.badge-only }}

permissions: {}

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      badge-only: ${{ steps.detect.outputs.badge-only }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          badge_only=false
          if [ "$EVENT_NAME" = pull_request ]; then
            # filename and previous_filename: a rename must not hide the file it moved from.
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
              --jq '.[] | .filename, (.previous_filename // empty)') || files=
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvxF .github/badges/mutation.json; then
              badge_only=true
            fi
          fi
          echo "badge-only=$badge_only" >> "$GITHUB_OUTPUT"
