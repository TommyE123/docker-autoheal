name: Release Please

on:
  push:
    branches:
      - main

concurrency:
  group: release-please-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Maintains a standing "Release PR" that accumulates Conventional Commit
  # changes since the last release. Merging an ordinary PR to main only
  # updates that Release PR - it never publishes anything by itself.
  # Merging the Release PR itself is a push to main like any other, which
  # is what this job recognises and turns into the tag + GitHub Release.
  release-please:
    name: Release Please
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Only runs when the release-please job actually created a release (i.e.
  # this push was the Release PR being merged) - never on an ordinary
  # application PR merging to main.
  docker-release:
    name: Build and publish Docker image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Checkout the exact commit release-please just tagged (the default
      # ref for this push-triggered run).
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Configure QEMU to support building images for multiple CPU architectures
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # Set up Docker Buildx builder for advanced multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Authenticate to Docker Hub for pushing built images
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Authenticate to GitHub Container Registry (GHCR) for pushing images
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate image metadata and tags for Docker registries. The version
      # tag comes directly from release-please's own output - it is never
      # recalculated here.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/docker-autoheal
            ghcr.io/${{ github.repository_owner }}/docker-autoheal
          tags: |
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest

      # Build the Docker image for multiple platforms and push to registries
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-autoheal
          cache-to: type=gha,mode=max,scope=docker-autoheal

      # Update the repository description on Docker Hub using the README
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/docker-autoheal
          readme-filepath: ./DOCKER_HUB_README.md

  # Publishes a continuously-updated "beta" image reflecting the current
  # state of main between releases. Skipped on the release-merge commit
  # itself, since docker-release already publishes an image for that commit.
  beta-build:
    name: Build and publish beta Docker image
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `beta` is mutable (always the current main); `beta-<shortsha>` is an
      # immutable tag for traceability, since a later push can overwrite `beta`.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/docker-autoheal
            ghcr.io/${{ github.repository_owner }}/docker-autoheal
          tags: |
            type=raw,value=beta
            type=raw,value=beta-{{sha}}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-autoheal
          cache-to: type=gha,mode=max,scope=docker-autoheal

  # Prunes old beta-<shortsha> tags after each beta-build push, keeping the
  # most recent BETA_TAGS_TO_KEEP in both registries. The mutable `beta` tag
  # and versioned release tags are never touched - the delete filters only
  # ever match tags shaped like `beta-<hex>`.
  beta-cleanup:
    name: Clean up old beta Docker image tags
    needs: [release-please, beta-build]
    if: needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest

    env:
      BETA_TAGS_TO_KEEP: 20

    permissions:
      packages: write

    steps:
      # GITHUB_TOKEN has admin rights on this package because this same
      # repository's workflow is what publishes it, so no extra PAT is
      # needed here (see GitHub's package-permissions docs).
      - name: Delete old beta-<shortsha> tags from GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          package="docker-autoheal"
          keep="${BETA_TAGS_TO_KEEP}"

          versions="[]"
          page=1
          while :; do
            batch=$(gh api "/users/${GHCR_OWNER}/packages/container/${package}/versions?per_page=100&page=${page}")
            count=$(echo "$batch" | jq 'length')
            [ "$count" -eq 0 ] && break
            versions=$(jq -s '.[0] + .[1]' <(echo "$versions") <(echo "$batch"))
            [ "$count" -lt 100 ] && break
            page=$((page + 1))
          done

          to_delete=$(echo "$versions" | jq -r --argjson keep "$keep" '
            map(select((.metadata.container.tags // []) | length > 0
              and all(.[]; test("^beta-[0-9a-f]+$"))))
            | sort_by(.created_at) | reverse
            | .[$keep:] | .[].id
          ')

          for id in $to_delete; do
            echo "Deleting GHCR package version $id"
            gh api --method DELETE "/users/${GHCR_OWNER}/packages/container/${package}/versions/${id}"
          done

      # Requires the DOCKERHUB_TOKEN secret to have "Read, Write, Delete"
      # access permissions on Docker Hub; a read/write-only token will fail
      # only the delete calls below, not the login/push steps above.
      - name: Delete old beta-<shortsha> tags from Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="docker-autoheal"
          keep="${BETA_TAGS_TO_KEEP}"

          jwt=$(curl -sS -X POST "https://hub.docker.com/v2/users/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
            | jq -r '.token')

          tags="[]"
          url="https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${repo}/tags/?page_size=100&ordering=last_updated"
          while [ -n "$url" ] && [ "$url" != "null" ]; do
            page=$(curl -sS -H "Authorization: Bearer ${jwt}" "$url")
            tags=$(jq -s '.[0] + .[1].results' <(echo "$tags") <(echo "$page"))
            url=$(echo "$page" | jq -r '.next')
          done

          to_delete=$(echo "$tags" | jq -r --argjson keep "$keep" '
            map(select(.name | test("^beta-[0-9a-f]+$")))
            | sort_by(.last_updated) | reverse
            | .[$keep:] | .[].name
          ')

          for tag in $to_delete; do
            echo "Deleting Docker Hub tag ${tag}"
            curl -sS -X DELETE -H "Authorization: Bearer ${jwt}" \
              "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${repo}/tags/${tag}/"
          done
