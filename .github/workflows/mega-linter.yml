# MegaLinter GitHub Action configuration file
# More info at https://megalinter.io
name: MegaLinter

# Trigger mega-linter on every PR to main.
on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # Skips MegaLinter for the automated mutation badge PR (badge file only). If this job
  # itself fails, badge-only is empty and it runs. See badge-only-check.yml.
  changes:
    permissions:
      contents: read
      pull-requests: read # Needed by badge-only-check.yml to list the pull request's changed files
    uses: ./.github/workflows/badge-only-check.yml

  megalinter:
    name: MegaLinter
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.badge-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Read-only: MegaLinter only needs to check out the code and publish its
    # own report artifact, never to commit, push, or open a PR.
    permissions:
      contents: read
      issues: write # MegaLinter posts its report comment
      pull-requests: write # MegaLinter posts its report comment
      statuses: write # Publishes the MegaLinter commit status

    steps:
      # Free runner disk space for MegaLinter. Security scanners such as Trivy
      # download large a vulnerability database during the run.
      # Fail if GitHub changes the runner layout so this does not silently regress.
      - name: Free Disk Space & Verify
        run: |
          echo "=== Initial Free Disk Space ==="
          df -h /

          # Ordered from lowest file count (fastest delete) to highest
          TARGETS=(
            "/usr/local/share/chromium"   # 480 files (~650 MB)
            "/usr/local/share/powershell" # 551 files (~1.3 GB)
            "/opt/microsoft"              # 952 files (~813 MB)
            "/usr/share/swift"            # 2,025 files (~3.3 GB)
          )

          echo ""
          echo "=== Validating & Removing Unused Directories ==="
          for dir in "${TARGETS[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "::error::Runner cleanup directory missing: $dir (runner layout may have changed)"
              exit 1
            fi
            echo "Removing $dir..."
            sudo rm -rf "$dir"
          done

          echo ""
          echo "=== Post-Cleanup Free Disk Space ==="
          df -h /

      # Git Checkout (Shallow clone to avoid tag bloat)
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # Fork PRs get a read-only GITHUB_TOKEN whatever the permissions block
      # says, so the comment and status reporters would fail.
      # Only enable them when the PR comes from this repository.
      - name: Detect write access
        id: access
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" = "$REPO" ]; then
            echo "can_write=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_write=false" >> "$GITHUB_OUTPUT"
          fi

      # MegaLinter
      - name: MegaLinter
        # More info at https://megalinter.io/latest/flavors/
        uses: oxsecurity/megalinter/flavors/cupcake@9949bad031045f366be2467e00e8371a7328a2e2 # v10.1.0
        env:
          # Linting behavior (VALIDATE_ALL_CODEBASE, DISABLE_ERRORS_LINTERS, etc.)
          # lives in .linter-rules/.mega-linter.yml so it's a single place to toggle.
          # https://megalinter.io/latest/configuration/
          MEGALINTER_CONFIG: .linter-rules/.mega-linter.yml
          # Environment variables override the config file, so these replace
          # its GITHUB_STATUS_REPORTER setting.
          GITHUB_TOKEN: ${{ steps.access.outputs.can_write == 'true' && secrets.GITHUB_TOKEN || '' }}
          GITHUB_COMMENT_REPORTER: ${{ steps.access.outputs.can_write }}
          GITHUB_STATUS_REPORTER: ${{ steps.access.outputs.can_write }}

      # Upload MegaLinter artifacts
      - name: Archive production artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          path: |
            megalinter-reports
            mega-linter.log
          if-no-files-found: ignore
