name: MegaLinter

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  megalinter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Run MegaLinter
        id: ml
        uses: oxsecurity/megalinter/actions/release@b51455b24b821fcb0c75e707c4e1b53e2e4b9e6b # v8.14.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive MegaLinter reports
        if: ${{ always() }}
        uses: actions/upload-artifact@d00a2f2cfc2ad2b46b19e134d292409e18edc9637 # v4.14.4
        with:
          name: megalinter-reports
          path: |
            megalinter-reports/
            mega-linter.log
