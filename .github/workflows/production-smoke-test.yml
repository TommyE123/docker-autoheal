name: Production Smoke Test

# A reusable workflow invoked as a job from docker-build.yml (see the
# smoke-test job there), not a standalone trigger: workflow_run only fires
# using the workflow file already on the default branch, so it could never
# run for the PR that introduces this file. Running as a job in the same
# pull_request-triggered run avoids that, and gives direct access to the
# same-repo guard docker-build.yml's own push step already uses.
#
# Against the exact image docker-build.yml built, it runs, in order: the container
# startup, health and Docker-connectivity checks, and then the full tagged Playwright UI
# E2E suite (frontend/e2e-ui), which includes a real auto-heal restart.
# Any failing step fails this job.
on:
  workflow_call:
    inputs:
      image_ref:
        description: "Exact image reference to test, e.g. ghcr.io/owner/docker-autoheal:sha-abc1234"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  smoke-test:
    name: Production container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the exact PR image
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: docker pull "$IMAGE_REF"

      # The suite's fixtures only create containers for an instance that monitors
      # autoheal.dev=true, and several tests change the app's configuration and event log.
      # So the image runs as a throwaway instance. It starts with no config, which proves
      # the image's default configuration (autoheal=true) loads, and is then switched to
      # autoheal.dev=true over the API before the suite runs.
      #
      # The suite creates containers on this runner's Docker daemon. That is only
      # acceptable on an ephemeral GitHub-hosted VM; run.sh additionally refuses to start
      # unless Docker is this machine's own local daemon (no DOCKER_HOST/DOCKER_CONTEXT,
      # a dockerd process, daemon name equal to the hostname).
      - name: Require an ephemeral GitHub-hosted runner for the UI E2E suite
        run: |
          if [ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]; then
            echo "::error::UI E2E creates containers on the runner's Docker daemon and only runs on GitHub-hosted runners (RUNNER_ENVIRONMENT='${RUNNER_ENVIRONMENT:-}')"
            exit 1
          fi

      - name: Start the image for the UI E2E suite
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          docker run -d --name autoheal-ui-e2e \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -p 3132:3131 \
            -e PYTHONUNBUFFERED=1 \
            --label autoheal.dev=false \
            "$IMAGE_REF"
          echo "UI E2E instance image: $(docker inspect --format '{{.Config.Image}} ({{.Image}})' autoheal-ui-e2e)"

      - name: Wait for the service to become ready
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3132/health >/dev/null; then
              echo "Service is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Auto-Heal service did not become ready within the timeout"
          exit 1

      - name: Verify the application can communicate with Docker
        # /api/status returns HTTP 200 even when Docker is unreachable
        # (docker_connected: false) rather than failing the request, so the
        # field itself - not just the HTTP status - has to be checked.
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3132/api/status | jq -e '.docker_connected == true' >/dev/null 2>&1; then
              echo "Application is connected to Docker"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Application never reported a successful Docker connection"
          exit 1

      - name: Verify the default monitor configuration
        run: |
          curl -sf http://localhost:3132/api/config \
            | jq -e '.monitor.label_key == "autoheal" and .monitor.label_value == "true"' >/dev/null \
            || { echo "::error::The image's default monitor label is not autoheal=true"; exit 1; }
          echo "Default monitor label is autoheal=true"

      # Same API the suite's configuration tests use; only the label changes.
      - name: Switch the instance to monitor autoheal.dev=true
        run: |
          body="$(curl -sf http://localhost:3132/api/config | jq -c '.monitor | .label_key = "autoheal.dev"')"
          curl -sf -X PUT http://localhost:3132/api/config/monitor \
            -H "Content-Type: application/json" -d "$body" >/dev/null
          # The suite's own fixtures re-check the label before every test; failing here
          # first gives a clearer message.
          curl -sf http://localhost:3132/api/config \
            | jq -e '.monitor.label_key == "autoheal.dev" and .monitor.label_value == "true"' >/dev/null \
            || { echo "::error::Instance does not monitor autoheal.dev=true after the switch"; exit 1; }
          echo "Instance monitors autoheal.dev=true"

      - name: Check out the UI E2E tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: frontend

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install UI E2E dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium and its system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # UI_E2E_BASE_URL makes run.sh use this running instance instead of starting the
      # dev stack. It always runs the full suite. run.sh exits 3
      # when the environment cannot be used and 1 when a test fails.
      - name: Run the full UI E2E suite against the built image
        env:
          UI_E2E_BASE_URL: http://localhost:3132
        run: |
          status=0
          bash frontend/e2e-ui/run.sh full headless || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::error::UI E2E tests failed; see the Playwright report artifact"
          fi
          exit "$status"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-e2e-report
          path: |
            frontend/playwright-report-ui/
            frontend/test-results-ui/
          if-no-files-found: ignore
          retention-days: 7

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "--- docker ps -a ---"
          docker ps -a
          echo "--- autoheal-ui-e2e logs ---"
          docker logs autoheal-ui-e2e || true
          echo "--- autoheal-ui-e2e inspect ---"
          docker inspect autoheal-ui-e2e || true
          if docker logs autoheal-ui-e2e 2>&1 | grep -qi "http+docker\|Not supported URL scheme"; then
            echo "::error::Confirmed known Docker SDK/requests 'http+docker' transport failure (see PR #61)"
          fi

      - name: Clean up
        if: always()
        run: |
          docker rm -f autoheal-ui-e2e 2>/dev/null || true
          # Containers the UI E2E suite labels, if its own teardown did not run.
          docker ps -aq --filter label=autoheal.e2e.run | xargs -r docker rm -f || true
