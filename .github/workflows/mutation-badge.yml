name: Mutation Badge

# Publishes the README mutation-score badge after a successful run of the
# mutation-testing workflow on main. It is a separate workflow so that the
# mutation workflow, which runs pull request code, stays read-only; this one
# holds the only write permission and runs no repository code. It publishes to
# a dedicated badges branch because the main ruleset does not allow direct
# pushes. Informational only, like the workflow it follows.
on: # zizmor: ignore[dangerous-triggers] - Runs no repository code; only validates and publishes one JSON file from a main-only run.
  workflow_run:
    workflows:
      - "Mutation Testing (informational)"
    types:
      - completed
    branches:
      - main

permissions: {}

concurrency:
  group: mutation-badge
  cancel-in-progress: false

jobs:
  publish:
    name: Publish mutation badge
    # Never publish from a pull request run, whatever its branch is called.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # download the artifact from the triggering run
      contents: write # push the badges branch

    steps:
      - name: Download badge data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-badge
          path: badge
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Publish to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The file is data from another workflow run: check its shape before publishing it.
          jq -e '.schemaVersion == 1 and .label == "Mutation" and (.message | test("^[0-9]+(\\.[0-9])?%$"))' badge/mutation.json > /dev/null
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git init -q publish
          cd publish
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          if git fetch -q --depth=1 origin badges; then
            git checkout -q -B badges FETCH_HEAD
          else
            git checkout -q --orphan badges
          fi
          mkdir -p badges
          cp ../badge/mutation.json badges/mutation.json
          git add badges/mutation.json
          if git diff --cached --quiet; then
            echo "Badge already up to date"
            exit 0
          fi
          git commit -q -m "chore: update mutation badge"
          git push -q origin badges
