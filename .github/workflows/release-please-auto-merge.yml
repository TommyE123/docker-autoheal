name: Weekly Release Please auto-merge

# Enables GitHub's native auto-merge on the standing Release Please PR every
# Friday at 13:00 UK local time. It never merges anything itself - GitHub
# handles required checks, approvals and the eventual merge. That merge is
# an ordinary push to main and is picked up unchanged by release-please.yml,
# which does the actual release/tag/Docker-publish work.
on:
  schedule:
    # GitHub Actions cron is UTC-only, but the UK alternates between GMT
    # (UTC+0) and BST (UTC+1). Firing at both 12:00 and 13:00 UTC every
    # Friday and then checking the real Europe/London wall-clock time in
    # the "Guard" step below is simpler and more robust than hand-tracking
    # the DST changeover dates here.
    - cron: "0 12 * * 5"
    - cron: "0 13 * * 5"
  workflow_dispatch:

concurrency:
  group: release-please-auto-merge
  cancel-in-progress: false

jobs:
  auto-merge-release-pr:
    name: Auto-merge the Release PR
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}

    steps:
      # Scheduled runs fire twice (once per possible UTC offset) so that one
      # of them lands on 13:00 UK local time whichever way the clocks are
      # set. Only the run that actually matches proceeds; the other is a
      # deliberate, successful no-op. A manual dispatch always proceeds.
      - name: Guard - only proceed at 13:00 UK local time
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run - proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          uk_hour=$(TZ=Europe/London date +%H)
          if [ "$uk_hour" = "13" ]; then
            echo "It's 13:00 in Europe/London - proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "It's ${uk_hour}:00 in Europe/London, not 13:00 - skipping this run."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      # Match the Release Please PR by repository-specific characteristics
      # rather than its title/version, which changes on every release.
      - name: Find the Release Please PR
        id: find
        if: steps.guard.outputs.proceed == 'true'
        run: |
          matches=$(gh pr list --repo "$REPO" \
            --base main --state open --label "autorelease: pending" \
            --json number,author,headRefName,headRepository,headRepositoryOwner |
            jq -c --arg owner "${REPO%%/*}" --arg repo "${REPO#*/}" '
              map(select(
                .author.login == "github-actions[bot]" and
                .headRefName == "release-please--branches--main" and
                .headRepositoryOwner.login == $owner and
                .headRepository.name == $repo
              ))
            ')

          count=$(echo "$matches" | jq 'length')
          echo "count=$count" >> "$GITHUB_OUTPUT"

          if [ "$count" -eq 0 ]; then
            echo "No matching Release PR found - nothing to do."
          elif [ "$count" -eq 1 ]; then
            pr_number=$(echo "$matches" | jq -r '.[0].number')
            echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
            echo "Found Release PR #$pr_number."
          else
            echo "::error::Found $count open PRs matching the Release Please PR criteria - expected at most 1. Not enabling auto-merge on any of them." >&2
            exit 1
          fi

      - name: Enable auto-merge on the Release PR
        if: steps.guard.outputs.proceed == 'true' && steps.find.outputs.count == '1'
        run: |
          pr_number="${{ steps.find.outputs.pr_number }}"

          already_enabled=$(gh pr view "$pr_number" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$already_enabled" = "true" ]; then
            echo "Auto-merge is already enabled on PR #$pr_number - nothing to do."
            exit 0
          fi

          echo "Enabling auto-merge (squash) on PR #$pr_number."
          gh pr merge "$pr_number" --repo "$REPO" --auto --squash
