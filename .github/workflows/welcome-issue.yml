name: Welcome Issue

on:
  issues:
    types:
      - opened

permissions:
  issues: write

jobs:
  welcome:
    runs-on: ubuntu-latest

    steps:
      - name: Greet first-time issue authors
        uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: >
            👋 Thanks for opening your first issue in docker-autoheal!


            We really appreciate you taking the time to report a problem or
            suggest an improvement.


            A maintainer will review it as soon as possible. If you're
            reporting a bug, please make sure the issue includes the relevant
            logs, configuration, Docker version, and steps to reproduce where
            possible.


            Thanks for helping improve the project! ❤️
