name: docker-autoheal-dev # Separate Compose project, so dev `up`/`down` never touch the deployment's project

# Development/testing override: runs this checkout beside an existing Autoheal deployment.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d
#
# Uses a distinct image tag, container name, host ports, data directory and monitoring
# label, so the deployment named `docker-autoheal` is left untouched. Only containers
# labelled `autoheal.dev=true` are monitored; `autoheal=true` containers (the production
# label) are ignored even though the Docker socket is shared. Override the ports with
# AUTOHEAL_DEV_PORT and AUTOHEAL_DEV_METRICS_PORT. `!override` replaces the base lists
# instead of appending to them (needs Docker Compose v2.24.4 or later).
services:
  autoheal:
    # Keeps the dev build from replacing the published `tommye123/docker-autoheal:latest`.
    image: docker-autoheal:dev
    container_name: docker-autoheal-dev
    # Seeds ./data-dev/config.json with the dev label on first start only; the app fills in
    # every other setting from its defaults and keeps any later edits made in the UI.
    command:
      - sh
      - -c
      - |
        [ -f /data/config.json ] || printf '{"monitor":{"label_key":"autoheal.dev"}}' > /data/config.json
        exec python -m app.main
    # Only changes the URLs shown in the startup logs; the server still listens on 0.0.0.0:3131
    # inside the container. Set AUTOHEAL_DEV_HOST to the address you reach this host at to log a
    # real URL; left unset, the logs only report the listen address. The port is the published one.
    environment:
      - AUTOHEAL_PUBLIC_HOST=${AUTOHEAL_DEV_HOST:-}
      - AUTOHEAL_PUBLIC_PORT=${AUTOHEAL_DEV_PORT:-3132}
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data-dev:/data
    ports: !override
      - "${AUTOHEAL_DEV_PORT:-3132}:3131" # Web UI (React)
      - "${AUTOHEAL_DEV_METRICS_PORT:-9091}:9090" # Prometheus metrics
