name: docker-autoheal-dev # Default project name only; COMPOSE_PROJECT_NAME overrides it, so always pass -p docker-autoheal-dev

# Development/testing override: runs this checkout inside the Dev Container, where Docker is an
# isolated daemon (Docker-in-Docker) that cannot see or affect the host's production containers.
# Host-side `docker compose` with this file still talks to the host daemon and is not isolated.
#
#   docker compose -p docker-autoheal-dev -f docker-compose.yml -f docker-compose.dev.yml up --build -d
#
# Uses a distinct image tag, container name, host ports, data directory and monitoring
# label. The label only controls automatic discovery; the isolation boundary is the Dev
# Container's own Docker daemon, which /var/run/docker.sock refers to inside it. Override the
# ports with AUTOHEAL_DEV_PORT and AUTOHEAL_DEV_METRICS_PORT. `!override` replaces the base lists
# instead of appending to them (needs Docker Compose v2.24.4 or later).
services:
  autoheal:
    # Keeps the dev build from replacing the published `tommye123/docker-autoheal:latest`.
    image: docker-autoheal:dev
    container_name: docker-autoheal-dev
    # Seeds ./data-dev/config.json with the dev label on first start only; the app fills in
    # every other setting from its defaults and keeps any later edits made in the UI. Fails
    # closed: a failed seed, or an existing config whose monitor section is missing, invalid or
    # still the production label, stops the container instead of letting the app fall back to
    # monitoring autoheal=true containers.
    command:
      - sh
      - -c
      - |
        set -eu
        if [ ! -f /data/config.json ]; then
          printf '{"monitor":{"label_key":"autoheal.dev"}}' > /data/config.json.tmp
          mv /data/config.json.tmp /data/config.json
        fi
        python - <<'PY'
        import json, sys
        from app.config.config_manager import MonitorConfig
        try:
            with open("/data/config.json") as f:
                monitor = MonitorConfig(**json.load(f)["monitor"])
        except Exception as error:
            sys.exit(f"Refusing to start: /data/config.json is not a valid dev config: {error}")
        if (monitor.label_key, monitor.label_value) == ("autoheal", "true"):
            sys.exit("Refusing to start: /data/config.json uses the production label autoheal=true")
        PY
        exec python -m app.main
    # Only changes the URLs shown in the startup logs; the server still listens on 0.0.0.0:3131
    # inside the container. Inside the Dev Container, localhost is the default because VS Code
    # forwards port 3132 to your desktop. Set AUTOHEAL_DEV_HOST only when running this override
    # from a host shell and you browse from another machine, so the logs show that host's address
    # (the default localhost is right on the host itself). This changes the log URL only; it does
    # not expose or forward any additional ports.
    environment:
      - AUTOHEAL_PUBLIC_HOST=${AUTOHEAL_DEV_HOST:-localhost}
      - AUTOHEAL_PUBLIC_PORT=${AUTOHEAL_DEV_PORT:-3132}
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data-dev:/data
    ports: !override
      - "${AUTOHEAL_DEV_PORT:-3132}:3131" # Web UI (React)
      - "${AUTOHEAL_DEV_METRICS_PORT:-9091}:9090" # Prometheus metrics
