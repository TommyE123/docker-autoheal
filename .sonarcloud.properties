# Extra configuration for SonarCloud automatic analysis. SonarCloud reads this
# file from the default branch; it ignores sonar-project.properties when
# automatic analysis is on.
# Docs: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis/

# The repository is analysed from its root. Test files are marked with
# sonar.test.inclusions rather than a separate sonar.tests path, because the
# Python tests (app/tests) sit inside the app source tree and the frontend tests
# sit next to the code they cover.
sonar.test.inclusions=app/tests/**,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**,frontend/e2e-ui/**

# All files in this repository are UTF-8 (see .editorconfig).
sonar.sourceEncoding=UTF-8

# Keep in step with the Python version in the Dockerfile. Renovate updates this
# line together with the Dockerfile and the Dev Container image (see
# docs/maintainer/dependency-management.md).
# renovate: datasource=docker depName=python versioning=docker
sonar.python.version=3.14
