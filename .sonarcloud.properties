# Extra configuration for SonarCloud. Automatic analysis reads this file from the
# default branch and ignores sonar-project.properties; the CI scan in
# .github/workflows/tests.yml loads it explicitly with -Dproject.settings.
# Docs: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis/

# The repository is analysed from its root. The Python tests (app/tests) sit
# inside the app source tree and the frontend tests sit next to the code they
# cover, so sonar.sources and sonar.tests both cover the whole repository and
# sonar.test.inclusions picks out which files are tests. Without sonar.tests,
# SonarCloud assumes there is no test code and ignores the inclusions.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=app/tests/**,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**,frontend/eslint-rules/**/*.test.js,frontend/e2e-ui/**

# Coverage report written by the pytest run in .github/workflows/tests.yml. Only the CI scan
# (the "SonarCloud scan" step, which loads this file with -Dproject.settings) imports it;
# automatic analysis cannot.
sonar.python.coverage.reportPaths=coverage.xml

# All files in this repository are UTF-8 (see .editorconfig).
sonar.sourceEncoding=UTF-8

# Keep in step with the Python version in the Dockerfile. Renovate updates this
# line together with the Dockerfile, the Dev Container image and
# pyrightconfig.json; Ruff's target-version is changed by hand (see
# docs/maintainer/dependency-management.md).
# renovate: datasource=docker depName=python versioning=docker
sonar.python.version=3.14
