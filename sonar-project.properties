# docker:S8431 flags Renovate's intentional tag@digest pinning format
# (e.g. FROM python:3.14-slim@sha256:...). The tag documents the version and
# the digest makes the build reproducible, so suppress this rule for
# Dockerfiles only. See issue #613.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.e1.resourceKey=**/Dockerfile*
