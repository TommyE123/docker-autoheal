[pytest]
# Only the unit-test suite is collected by default. The scripts directly under
# app/tests/ (and in the repository root) are manual/integration helpers that
# require a running Docker daemon and a running Auto-Heal service.
testpaths = app/tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers
