[pytest]
# Only the unit-test suite is collected by default. app/tests/integration/
# holds a separate suite that requires a live Docker daemon and/or a running
# Auto-Heal service; it is only collected when pytest is pointed at it
# explicitly (see docs/TESTING.md), never by a plain `pytest` run.
testpaths = app/tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers
markers =
    integration: requires a live Docker daemon and/or a running Auto-Heal service; not collected by a plain `pytest` run (see docs/TESTING.md).
