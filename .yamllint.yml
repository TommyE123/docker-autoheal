# Configuration file for yamllint.
# Documentation: https://yamllint.readthedocs.io/en/stable/configuration.html
extends: default

# *.lock.yml files under .github/workflows/ are compiled by the `gh aw`
# GitHub Agentic Workflows CLI from a Markdown source and are not
# hand-authored; `gh aw compile --yamllint` is the correct validation for
# them instead.
#
# node_modules is only relevant locally (CI's MegaLinter run never installs
# it), but the "Lint YAML" VS Code task runs `yamllint --strict .` against
# the whole workspace, so it needs excluding here or it lints vendored
# packages under frontend/node_modules and .devcontainer/node_modules.
ignore: |
  .github/workflows/*.lock.yml
  node_modules/

rules:
  comments:
    min-spaces-from-content: 1
  document-start: disable
  line-length:
    max: 200
  truthy:
    ignore: |
      .github/workflows/devcontainer.yml
      .github/workflows/docker-build.yml
      .github/workflows/greetings.yml
      .github/workflows/labels-sync.yml
      .github/workflows/mega-linter.yml
      .github/workflows/production-smoke-test.yml
      .github/workflows/release-please.yml
      .github/workflows/release-please-auto-merge.yml
      .github/workflows/semantic-pr-title.yml
      .github/workflows/tests.yml
