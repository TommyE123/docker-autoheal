services:
  autoheal:
    image: tommye123/docker-autoheal:latest
    container_name: docker-autoheal
    restart: unless-stopped
    volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/data
    ports:
      - "3131:3131"
    environment:
      - PYTHONUNBUFFERED=1
    labels:
      - "autoheal=false"
