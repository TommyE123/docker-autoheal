# Developer CLI tools only. Application dependencies stay in requirements*.txt and
# frontend/package.json; the npm-based linters stay in .devcontainer/package.json.
# Deliberately unpinned with no lockfile: these tools only run locally in the Dev Container,
# so they float to the latest release (post-create.sh runs `mise install` and `mise upgrade`).
# CI uses MegaLinter's own bundled versions. See docs/maintainer/dependency-management.md.
[tools]
# Installer for the pypi: tools below.
uv = "latest"
"aqua:rhysd/actionlint" = "latest"
"aqua:hadolint/hadolint" = "latest"
"aqua:aquasecurity/trivy" = "latest"
"aqua:trufflesecurity/trufflehog" = "latest"
"aqua:betterleaks/betterleaks" = "latest"
"aqua:editorconfig-checker/editorconfig-checker" = "latest"
"aqua:astral-sh/ruff" = "latest"
"aqua:koalaman/shellcheck" = "latest"
"aqua:mvdan/sh" = "latest"
"aqua:zizmorcore/zizmor" = "latest"
"pypi:semgrep" = "latest"
"pypi:yamllint" = "latest"
"pypi:djlint" = "latest"
