# Test script to verify Docker Auto-Heal Service
# Run with Docker Compose to test the auto-heal functionality

services:
  autoheal:
    build: .
    container_name: docker-autoheal
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/app/logs
    ports:
      - "3131:3131"
      - "9090:9090"
    environment:
      - PYTHONUNBUFFERED=1
    labels:
      - "autoheal=false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3131/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Test container 1: Healthy nginx
  nginx-healthy:
    image: nginx:alpine@sha256:62ff2089abf5a9ed33bd232895bef5e22f7bb4b200675cec49a5ebc48e3d4ac8
    container_name: nginx-healthy
    restart: unless-stopped
    ports:
      - "8081:80"
    labels:
      - "autoheal=true"
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Test container 2: Container that will fail (for testing restart)
  failing-container:
    image: alpine:latest@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    container_name: failing-container
    restart: on-failure
    labels:
      - "autoheal=true"
    # This will exit with code 1 after 30 seconds, triggering autoheal
    command: sh -c "sleep 30 && exit 1"

  # Test container 3: Container with custom health check (HTTP)
  http-test:
    image: python:3.14-alpine@sha256:9e9fde4d32eedce0b661d9ab91e826b62dddf28e928c230ec55f1866cac66b01
    container_name: http-test
    restart: unless-stopped
    labels:
      - "autoheal=true"
    ports:
      - "8082:8000"
    # Simple HTTP server for health check testing
    command: python -m http.server 8000
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8000/",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

  # Test container 4: Redis with TCP health check
  redis-test:
    image: redis:alpine@sha256:ba6e394f6acc2a695ef1b6944f161b9ca813711739be68319fa0db3470673f1d
    container_name: redis-test
    restart: unless-stopped
    labels:
      - "autoheal=true"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Test container 5: Container not monitored (no label)
  nginx-no-autoheal:
    image: nginx:alpine@sha256:62ff2089abf5a9ed33bd232895bef5e22f7bb4b200675cec49a5ebc48e3d4ac8
    container_name: nginx-no-autoheal
    restart: unless-stopped
    ports:
      - "8083:80"
