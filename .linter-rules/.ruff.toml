target-version = "py314"
line-length = 100

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "SIM",
    "PERF",
    "S",
    "PL",
    "ARG",
    "PTH",
    "DTZ",
    "PT",
    "RET",
    "RSE",
    "TC",
    "ASYNC",
    "TID",
    "SLF",
    "ERA",
    "LOG",
    "N",
    "PIE",
    "RUF",
    "UP",
    "ANN",  # policy: docs/developer/type-annotations.md

    # --- Deferred families --------------------------------------------
    # Pulled out of select rather than ignored code-by-code: these were
    # the largest categories in the latest megalinter run and we're
    # committing to fixing them properly, not nibbling at them.
    # Re-add to select (and delete this comment) when that work starts.
    #   "G",    # logging format - mainly f-strings passed to logger calls
    #            instead of lazy `%` formatting, plus a couple of
    #            logging.exception vs logging.error(exc_info=True) spots;
    #            worth a pass since some of these do affect what gets logged.
    #   "TRY",  # exception-handling style (tryceratops) - things like
    #            logging.error instead of logging.exception inside except
    #            blocks, raising inside a try that could be restructured,
    #            and overly long inline exception messages.
    #   "D",    # pydocstyle - missing/malformed docstrings on modules,
    #            classes and functions; overlaps with the ANN pass above
    #            in terms of which files need attention.
]

ignore = [
    "E111",
    "E114",
    "E117",
    "E501",

    # --- Deferred: local/lazy imports -----------------------------------
    # PLC0415 (`import` should be at top-level) - flags function-local
    # imports, mostly inside api.py's route handlers. Some of
    # these are a deliberate pattern (avoiding circular imports, keeping
    # startup-time imports light) and some may just be unintentional
    # sprawl; worth going through each occurrence individually rather than
    # blanket-fixing, since the right fix differs case by case.
    "PLC0415",

    # ANN401 (typing.Any) is allowed by the annotation policy for JSON-shaped
    # payloads and untyped third-party boundaries; see
    # docs/developer/type-annotations.md.
    "ANN401",
]

[lint.isort]
known-first-party = ["app"]

[lint.per-file-ignores]
# --- Deferred: test-only noise ---------------------------------------
# D is still off everywhere (see the select comment above), and ANN is
# ignored for tests below (policy: docs/developer/type-annotations.md), so
# the test-specific rules to list here are:
#   SLF001                  - private-member access, e.g.
#            `engine._handle_container_restart` or `engine._last_restart_times`
#            reached into directly from a test; unit tests routinely do this
#            to assert on internal state, so it's expected here, not a smell.
#   PLR2004                 - literal ("magic") values used in comparisons,
#            e.g. `== 3`, `== 20`, `== 80` in assertions; those are expected
#            test data/fixture values, not constants that need naming.
#   ARG001, ARG002, ARG005  - unused fixture/mock/lambda arguments, e.g.
#            `docker_client`, `update_config`, or a lambda's unused `k`;
#            a standard pytest pattern for autouse or injected fixtures
#            that a given test doesn't need to reference directly.
#   S105, S106              - hardcoded-password/secret detections, e.g. a
#            fake token or password string used to construct a mock
#            notification config; these are test fixtures, not real
#            credentials, so the rule is a false positive here specifically.
# Revisit alongside the select-level deferrals above.
"**/tests/**" = ["ANN", "S101", "SLF001", "PLR2004", "ARG001", "ARG002", "ARG005", "S105", "S106"]

# FastAPI turns a route handler's return annotation into a response model, so
# annotating handlers would change validation and serialisation; see
# docs/developer/type-annotations.md.
"app/api/routes/**" = ["ANN201"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
